plugins { id 'com.android.application' }
android {
  buildFeatures { buildConfig true }
  namespace 'com.kolbomusic.video'
  compileSdk 35
  defaultConfig {
    def plannerUrl = (System.getenv('KOLBO_PLANNER_URL') ?: '').trim()
    if(plannerUrl && !(plannerUrl ==~ /^https:\/\/[a-zA-Z0-9.-]+\/v1\/plan$/))
      throw new GradleException("KOLBO_PLANNER_URL must be an HTTPS /v1/plan URL with no token or query")
    buildConfigField 'String', 'CLOUD_PLANNER_URL', '"'+plannerUrl+'"'
    applicationId 'com.kolbomusic.video.lightcloud'
    minSdk 26
    targetSdk 35
    versionCode 530
    versionName '5.3.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.media3:media3-exoplayer:1.6.1'
  implementation 'androidx.media3:media3-ui:1.6.1'
}
