plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kolbomusic.trancestudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kolbomusic.trancestudio'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
