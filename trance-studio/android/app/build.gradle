plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kolbomusic.trancestudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kolbomusic.trancestudio.story26'
        minSdk 29
        targetSdk 34
        versionCode 26
        versionName '2.4.0-beta'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
