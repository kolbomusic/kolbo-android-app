plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kolbomusic.trancestudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kolbomusic.trancestudio.story2462'
        minSdk 29
        targetSdk 34
        versionCode 248
        versionName '2.4.7-beta.1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
