name: Karnafim Google Safe Browsing status
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - '.github/workflows/karnafim-google-safe-browsing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-google-status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Google's public host safety status without an API key
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, pathlib, sys, urllib.request
          domain = "karnafim-community-46.onrender.com"
          url = "https://transparencyreport.google.com/transparencyreport/api/v3/safebrowsing/status?site=" + domain
          result = {"site": domain, "classification": "unverified", "source": "Google Transparency Report"}
          try:
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; KarnafimStatusCheck/1.0)", "Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(100000).decode("utf-8", "replace")
              pos = raw.find('[[')
              if pos < 0:
                  raise ValueError("Google status payload missing")
              records = json.loads(raw[pos:])
              if not isinstance(records, list) or not records or not isinstance(records[0], list) or len(records[0]) < 8 or records[0][0] != "sb.ssr":
                  raise ValueError("Unexpected Google status format")
              row = records[0]
              code = int(row[1])
              result["code"] = code
              result["phishing_signal"] = bool(row[4])
              result["classification"] = {1:"no_unsafe_content_found",2:"unsafe",3:"some_pages_unsafe",5:"uncommon_downloads",6:"no_available_data"}.get(code, "unverified")
              if len(row) > 7 and isinstance(row[7], (int, float)):
                  result["google_update_utc"] = datetime.datetime.fromtimestamp(row[7]/1000, datetime.timezone.utc).isoformat()
          except Exception as exc:
              result["error"] = type(exc).__name__ + ": " + str(exc)[:180]
          pathlib.Path("karnafim-google-status.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("GOOGLE_STATUS=" + json.dumps(result, ensure_ascii=False))
          if result["classification"] == "no_unsafe_content_found" and not result.get("phishing_signal"):
              print("Google public site-status indicates no unsafe content. Still verify Search Console and browser before release.")
              sys.exit(0)
          print("::warning::The Google site-status is unsafe or cannot be independently verified; KEEP READ-ONLY HOLD.")
          sys.exit(1)
          PY
      - name: Save Google status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karnafim-google-status
          path: karnafim-google-status.json
          retention-days: 7
          if-no-files-found: warn

# Rerun public Google classification check after original-domain rebuild on 2026-11-03.
