name: Karnafim member publishing tests
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-publishing-tests.yml'
  workflow_dispatch:
jobs:
  test-member-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r karnafim-site/requirements.txt
      - name: Compile Flask modules
        run: python -m compileall -q karnafim-site
      - name: Verify privacy lockdown including accidental maintenance-off configuration
        run: python -m unittest discover -s karnafim-site/tests -p 'test_readonly_boot.py' -v
      - name: Test story, event and photo publishing without production database
        run: python karnafim-site/tests/test_publish.py
      - name: Verify moderator media access without leaking pending uploads
        run: python karnafim-site/tests/test_media_access.py
      - name: Confirm private conversation attachment isolation
        run: python karnafim-site/tests/test_chat_attachment_authorization.py
      - name: Verify Google OIDC and removal of local credential forms
        run: python karnafim-site/tests/test_google_identity.py
      - name: Verify member account linking and explicit consent without real Google or database calls
        run: python karnafim-site/tests/test_member_google_linking.py
      - name: Verify moderation engine safety boundaries
        run: python karnafim-site/tests/test_moderation.py
      - name: Verify page accessibility landmarks
        run: python karnafim-site/tests/test_accessibility.py
