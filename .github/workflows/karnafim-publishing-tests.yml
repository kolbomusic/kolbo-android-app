name: Karnafim rebuilt public publishing safeguards
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-publishing-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuilt-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rebuilt Flask dependencies
        run: python -m pip install -r karnafim-site/requirements.txt
      - name: Verify public pages, locked account routes and private media safeguards
        run: python karnafim-site/tests/test_rebuilt_design.py
