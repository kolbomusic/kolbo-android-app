name: Kolbo 4.7.3 Hebrew Brain native APK
on:
  push:
    branches: [kolbo-video-v473-hebrew-intent-brain-20261014]
    paths:
      - mobile-kolbo/**
      - .github/workflows/kolbo-v473-hebrew-brain-apk.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-brain-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Test original Hebrew lexicon and general scene planner offline
        run: |
          mkdir -p /tmp/hebrew-brain-tests
          javac -encoding UTF-8 -d /tmp/hebrew-brain-tests \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/HebrewIntentBrain.java \
            mobile-kolbo/test/HebrewIntentBrainTest.java
          java -cp /tmp/hebrew-brain-tests com.kolbomusic.video.HebrewIntentBrainTest
      - name: Test previous natural-language and provider-error regressions
        run: |
          javac -encoding UTF-8 -d /tmp/hebrew-brain-tests \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/HebrewStoryDirector.java \
            mobile-kolbo/test/HebrewStoryDirectorTest.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/ProviderErrorClassifier.java \
            mobile-kolbo/test/ProviderErrorClassifierTest.java
          java -cp /tmp/hebrew-brain-tests com.kolbomusic.video.HebrewStoryDirectorTest
          java -cp /tmp/hebrew-brain-tests com.kolbomusic.video.ProviderErrorClassifierTest
      - name: Fail if language brain is disconnected, copies external data, or embeds paid key
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("mobile-kolbo/app/src/main/java/com/kolbomusic/video")
          brain=(base/"HebrewIntentBrain.java").read_text()
          ui=(base/"MainActivity.java").read_text()
          wan=(base/"WanNativeClient.java").read_text()
          for value in ("original hand-authored","actionText","soundtrack",
                        "count","negated","getPixels" if False else "normalize"):
              assert value in brain, value
          assert "HebrewIntentBrain.interpret(x.toString())" in ui
          assert "HebrewIntentBrain.interpret(story)" in ui
          assert "HebrewIntentBrain.interpret(hebrew.trim())" in wan
          assert "scene.prompt(english)" in wan
          assert "HebrewActionTranslator.translate(scene.actionText" in wan
          assert "MediaMetadataRetriever" in ui
          assert "ExoPlayer.Builder" in ui
          assert "WebView" not in ui
          gradle=Path("mobile-kolbo/app/build.gradle").read_text()
          assert "com.google.mlkit:translate" in gradle
          assert "versionName '4.7.3'" in gradle
          assert "applicationId 'com.kolbomusic.video.hebrewbrain'" in gradle
          print("PASS: original Hebrew scene parser connected from UI to actual free video call")
          PY
      - name: Provision Android 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build installable native Android debug APK
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Strict signature and package check
        run: |
          APK=mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v4.7.3-Hebrew-Brain-Android-APK
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
