name: Kolbo Video 4.7.0 Hebrew action translation native APK
on:
  push:
    branches: [kolbo-video-v470-hebrew-action-translation-20261014]
    paths:
      - 'mobile-kolbo/**'
      - '.github/workflows/kolbo-v470-translation-native-android.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Native UI, privacy and no-WebView invariant checks
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("mobile-kolbo/app/src/main/java/com/kolbomusic/video")
          ui=(base/"MainActivity.java").read_text(encoding="utf-8")
          api=(base/"WanNativeClient.java").read_text(encoding="utf-8")
          required=("כלבו וידאו AI","בחר תמונה מהטלפון","צור סרטון AI",
              "שמור סרטון לטלפון","הסרטון לא ביצע את ההנחיה",
              "ACTION_OPEN_DOCUMENT","VideoView","ProgressBar",
              "third_party", "provider")
          for name in required[:8]:assert name in ui,name
          forbidden=("WebView","WebChromeClient","WebSettings","setJavaScriptEnabled",
              "huggingface.co/spaces","getUserMedia")
          for item in forbidden:assert item not in ui,item
          for name in ("preflight()","/gradio_api/upload","/gradio_api/call/generate_video",
              "event_id","beforeSubmission()","HttpURLConnection",
              "https","/gradio_api/file="):
              assert name in api,name
          assert "setInstanceFollowRedirects(false)" in api
          assert "versionName '4.7.0'" in Path("mobile-kolbo/app/build.gradle").read_text()
          helper=(base/"HebrewActionTranslator.java").read_text(encoding="utf-8")
          assert "TranslateLanguage.HEBREW" in helper
          assert "TranslateLanguage.ENGLISH" in helper
          assert "HebrewActionTranslator.translate" in api
          assert "com.google.mlkit:translate:17.0.3" in Path("mobile-kolbo/app/build.gradle").read_text()
          print("PASS: entire UI native RTL, on-device translation and no provider WebView")
          PY
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Compile native Hebrew Android application
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Verify signed debug APK identity and size
        run: |
          APK=mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v4.7.0-Native-Hebrew-Translated-AI-Android
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
