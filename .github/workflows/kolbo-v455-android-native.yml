name: Kolbo Video 4.5.5 Native Zero-Setup Android
on:
  push:
    branches: [kolbo-video-v455-zero-setup-native-studio-20261013]
    paths:
      - 'mobile-kolbo/**'
      - '.github/workflows/kolbo-v455-android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assert no manual server or third-party-provider launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('mobile-kolbo/app/src/main/java/com/kolbomusic/video/MainActivity.java').read_text()
          for rejected in ['your-server.example','huggingface.co/spaces','openApprovedGpuPage','server.getText()','setText("פתח את אולפן הווידאו")']:
              assert rejected not in src, rejected
          for required in ['HUB_ORIGIN','NativeReadiness.canOpenStudio','private_media_upload_enabled','real_video_generation_verified','paid_gpu_fallback_enabled','ACTION_GET_CONTENT','draft_prompt']:
              assert required in src, required
          print('Zero manual configuration and no third-party provider routing: PASS')
          PY
      - name: Readiness gate Java unit test
        run: |
          mkdir -p /tmp/kolbo-java-tests
          javac -d /tmp/kolbo-java-tests mobile-kolbo/app/src/main/java/com/kolbomusic/video/NativeReadiness.java mobile-kolbo/test/ReadinessGateTest.java
          java -cp /tmp/kolbo-java-tests com.kolbomusic.video.ReadinessGateTest
      - name: Ensure Android SDK platform is available
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK without production secrets
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Verify build artifact
        run: |
          test -s mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          sha256sum mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v4.5.5-Zero-Setup-Android
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
