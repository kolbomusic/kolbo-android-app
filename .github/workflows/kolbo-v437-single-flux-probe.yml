name: Kolbo v437 - one FREE synthetic FLUX stage job (diagnosis only)
on:
  push:
    branches: [kolbo-video-v437-scene-provider-resilience-20261011]
    paths: ['.github/workflows/kolbo-v437-single-flux-probe.yml']
permissions:
  contents: read
concurrency:
  group: kolbo-v437-single-synthetic-scene-job
  cancel-in-progress: false
jobs:
  synthetic_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q "gradio_client>=2,<3" "Pillow>=10,<13"
      - name: ONE model job, no user photos, no paid account, no retry
        env:
          KOLBO_SCENE_BUILDER_V433: EXPLICITLY_ENABLED
          KOLBO_ALLOW_EXTERNAL_TEST_MEDIA: EXPLICITLY_ENABLED
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import sys,json,time
          sys.path.insert(0,'gateway/backend')
          import experimental_scene_builder_v433 as scene
          d=Path('synthetic-flux-check')
          d.mkdir(exist_ok=True)
          image=Image.new('RGB',(768,768),(32,32,45))
          p=ImageDraw.Draw(image)
          for x,c in [(205,'#408BD8'),(563,'#D87645')]:
              p.ellipse((x-55,94,x+55,218),fill='#DBB08B')
              p.rounded_rectangle((x-89,220,x+89,540),25,fill=c)
          image.save(d/'input.png')
          started=time.monotonic()
          response={'real_person_media':False,'submitted_once':True,
                    'new_scene_produced':False,'provider':'public_FLUX_Kontext',
                    'commercial_rights_verified':False,
                    'user_identification_performed':False}
          try:
              receipt=scene.build(source=d/'input.png',
                  prompt='Transform into a common outdoor concert stage at the Caesarea amphitheater in Israel with both different illustrated performers singing into microphones in front of a big audience; remove portrait panels',
                  destination=d/'scene.png',consent=True,
                  wait_seconds=330)
              response.update(new_scene_produced=True,code='success',
                              mean_pixel_difference=receipt.pixel_difference_mean)
          except scene.SceneUnavailable as e:
              response['code']=e.reason
          except scene.SceneUncertain:
              response['code']='submission_uncertain_no_retry'
          except Exception as e:
              response['code']='other_safe_error_'+type(e).__name__
          response['elapsed_s']=round(time.monotonic()-started,1)
          (d/'result.json').write_text(json.dumps(response,indent=2))
          print('ONE_PUBLIC_STAGE_PROBE',json.dumps(response),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kolbo-v437-single-public-FLUX-health-probe
          path: synthetic-flux-check/
          retention-days: 5
          if-no-files-found: warn
