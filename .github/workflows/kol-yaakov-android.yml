name: Build Kol Yaakov Android Release

on:
  push:
    branches:
      - build/kol-yaakov-v0.3.0-signed
    paths:
      - 'kol-yaakov-mobile/**'
      - '.github/workflows/kol-yaakov-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore embedded mobile app
        working-directory: kol-yaakov-mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat app/src/main/assets/chunks/chunk_* | tr -d '\n\r' | base64 -d > app/src/main/assets/index.html
          test "$(wc -c < app/src/main/assets/index.html)" = "42918"
          echo "13abb58f40e25160e3549356b00fc089af4d990b33bf7d7d2d8bfdfe89813c3d  app/src/main/assets/index.html" | sha256sum -c -
          rm -rf app/src/main/assets/chunks

      - name: Build release APK
        working-directory: kol-yaakov-mobile
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Validate unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$GITHUB_WORKSPACE/kol-yaakov-mobile/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/APK_BADGING.txt"
          grep -q "package: name='com.ofirgilboa.kolyaakov'" "$GITHUB_WORKSPACE/APK_BADGING.txt"
          grep -q "application-label-he:'קול יעקב'" "$GITHUB_WORKSPACE/APK_BADGING.txt" || grep -q "application-label:'קול יעקב'" "$GITHUB_WORKSPACE/APK_BADGING.txt"
          cp "$APK" "$GITHUB_WORKSPACE/Kol-Yaakov-Mobile-v0.3.0-UNSIGNED.apk"
          sha256sum "$GITHUB_WORKSPACE/Kol-Yaakov-Mobile-v0.3.0-UNSIGNED.apk" > "$GITHUB_WORKSPACE/UNSIGNED_SHA256.txt"

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kol-Yaakov-Mobile-v0.3.0-UNSIGNED
          retention-days: 1
          if-no-files-found: error
          path: |
            Kol-Yaakov-Mobile-v0.3.0-UNSIGNED.apk
            APK_BADGING.txt
            UNSIGNED_SHA256.txt
