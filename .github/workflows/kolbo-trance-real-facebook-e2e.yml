name: Prove real public Facebook video import with ffprobe
on:
  push:
    branches:
      - kolbo-trance-real-public-facebook-e2e-verification-20261102
    paths:
      - 'trance-studio/tests/live_real_public_facebook_import.py'
      - 'trance-studio/backend/link_import.py'
      - '.github/workflows/kolbo-trance-real-facebook-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-public-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real production media extractor
        run: |
          python -m pip install --disable-pip-version-check 'yt-dlp[curl-cffi]==2026.10.26'
          ffprobe -version | head -n 1
      - name: Validate real Facebook public MP4 bytes, streams and duration
        run: python trance-studio/tests/live_real_public_facebook_import.py
