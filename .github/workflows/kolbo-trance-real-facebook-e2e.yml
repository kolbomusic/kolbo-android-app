name: Prove real public Facebook video import with ffprobe
on:
  push:
    branches:
      - kolbo-trance-real-public-facebook-e2e-verification-20261102
      - kolbo-trance-public-short-share-real-qa-20261102
      - kolbo-trance-facebook-trace-7ecfd487-20261102
    paths:
      - 'trance-studio/tests/live_real_public_facebook_import.py'
      - 'trance-studio/tests/live_real_facebook_flask_endpoint.py'
      - 'trance-studio/tests/live_real_facebook_render_production.py'
      - 'trance-studio/tests/live_real_facebook_short_share_v.py'
      - 'trance-studio/backend/link_import.py'
      - '.github/workflows/kolbo-trance-real-facebook-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-public-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production extractor and real FFmpeg probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'yt-dlp[curl-cffi]==2026.10.26'
          ffprobe -version | head -n 1
      - name: Validate real Facebook public MP4 bytes, streams and duration
        run: python trance-studio/tests/live_real_public_facebook_import.py
      - name: Prove actual Facebook share-v short-link resolves correct video and downloads MP4
        run: python trance-studio/tests/live_real_facebook_short_share_v.py
      - name: Install server dependencies for real authenticated API check
        run: python -m pip install --disable-pip-version-check -r trance-studio/backend/requirements.txt
      - name: Prove /studio session and real /api/import-link streaming an MP4
        run: python trance-studio/tests/live_real_facebook_flask_endpoint.py
      - name: Prove real deployed Render studio import and media validation
        run: python trance-studio/tests/live_real_facebook_render_production.py
