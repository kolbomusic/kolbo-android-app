name: Karnafim rebuilt disposable PostgreSQL member journey
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-postgres-member-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barkan_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: barkan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barkan_ci -d barkan_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://barkan_ci:synthetic_ci_only@localhost:5432/barkan_ci
      BARKAN_DATABASE_URL: postgresql://barkan_ci:synthetic_ci_only@localhost:5432/barkan_ci
      BARKAN_SESSION_SECRET: synthetic-test-only-not-for-production
      BARKAN_SAFETY_RELEASE_APPROVED: '1'
      BARKAN_PUBLIC_AUTH: '1'
      BARKAN_ALLOW_SIGNUP: '1'
      BARKAN_RESEND_API_KEY: synthetic-no-outbound-email
      BARKAN_MAIL_FROM: Synthetic <noreply@example.test>
      BARKAN_ADMIN_EMAIL: admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r karnafim-site/requirements.txt
      - name: Test legacy password migration, login, verification, media, moderation, messaging
        run: python karnafim-site/tests/test_rebuilt_integration.py
