name: Kolbo Video v433 - Two-person scene builder with QA and security CI
on:
  push:
    branches: [kolbo-video-v433-scene-compliance-gates-20261011]
    paths:
      - "gateway/**"
      - ".github/workflows/kolbo-v433-scene-backend-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kolbo_ci
          POSTGRES_PASSWORD: kolbo_ci_fixture_only
          POSTGRES_DB: kolbo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kolbo_ci -d kolbo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KOLBO_TEST_PG_DSN: postgresql://kolbo_ci:kolbo_ci_fixture_only@localhost:5432/kolbo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg test fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Install test and gateway dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r gateway/backend/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest httpx pyyaml
          ffprobe -version | head -1
      - name: Verify fail-closed provider routing and Render configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('gateway')
          spec=yaml.safe_load((root/'render.yaml').read_text(encoding='utf-8'))
          assert len(spec['services'])==1
          svc=spec['services'][0]
          assert svc['name']=='kolbo-video-agnes-gateway'
          assert svc['plan']=='free' and svc['autoDeploy'] is False
          assert svc['healthCheckPath']=='/healthz'
          assert {e['key']:e for e in svc['envVars']}['KOLBO_AGNES_PROMO_ACK']['value']=='NOT_YET_CHECKED'
          adapter=(root/'backend/agnes_adapter.py').read_text(encoding='utf-8')
          assert "MODEL = 'agnes-video-2.5-flash'" in adapter
          assert "agnes-video-2.5'" not in adapter.split("MODEL = ")[1].splitlines()[0]
          server=(root/'backend/server.py').read_text(encoding='utf-8')
          assert "AGNES_PROMO_ACK = " in server
          assert "PUBLIC_BASE+'/v1/media/'" in server
          assert "verify_video(output,spec.seconds)" in server
          assert "def infrastructure_health()" in server
          assert "def require_auth(" in server
          assert "app = FastAPI(" in server
          print("PASS: isolated free deployment blueprint, disabled-by-default pricing, no paid fallback, privacy / duration guards")
          PY
      - name: Run server and provider-mock integration tests
        run: |
          cd gateway
          python -m pytest -q -p no:cacheprovider backend/tests
      - name: Build and boot Render Docker with all staging modules, without real provider keys
        run: |
          docker build -f gateway/backend/Dockerfile.render gateway/backend -t kolbo-video-staging-v413:ci
          docker run -d --name kolbo-video-staging-ci             -p 127.0.0.1:19876:10000             -e KOLBO_RENDER_PROVIDER=agnes             -e KOLBO_ORCHESTRATOR_PREFLIGHT=             kolbo-video-staging-v413:ci
          trap 'docker rm -f kolbo-video-staging-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19876/healthz | grep -q '"alive":true'; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs kolbo-video-staging-ci
            exit 1
          fi
          http_code=$(curl --silent --output /dev/null --write-out '%{http_code}'             --request POST http://127.0.0.1:19876/v1/orchestrator/plan             --header 'Content-Type: application/json'             --data '{"seconds":8,"independent_people":2}')
          test "$http_code" = "401"
          echo "PASS: Docker boot, public health, and authenticated-only staging planner"

      - name: Smoke experimental WAN Docker with all user media transfers disabled
        run: |
          docker build -f gateway/backend/Dockerfile.wan-staging gateway/backend -t kolbo-video-wan416:ci
          docker run -d --name kolbo-wan416-staging-ci \
            -p 127.0.0.1:19877:10000 \
            -e KOLBO_ALLOW_EXTERNAL_TEST_MEDIA=DISABLED \
            -e KOLBO_V416_API_TOKEN=ci_test_token_at_least_32_characters_long \
            kolbo-video-wan416:ci
          trap 'docker rm -f kolbo-wan416-staging-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19877/healthz | grep -q '"alive":true'; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs kolbo-wan416-staging-ci
            exit 1
          fi
          unauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19877/v1/health)
          test "$unauth" = "401"
          curl --fail --silent \
             -H 'Authorization: Bearer ci_test_token_at_least_32_characters_long' \
             http://127.0.0.1:19877/v1/health \
             | python -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="not_ready"; assert x["supported_image_counts"]==[1]; assert x["storage_durable"] is False'
          echo 'PASS: staging WAN container starts, denies unauthenticated requests and cannot submit real media by default'
