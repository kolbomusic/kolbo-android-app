name: Kolbo Video 4.7.1 Hebrew provider-failure recovery APK
on:
  push:
    branches: [kolbo-video-v471-provider-error-recovery-20261014]
    paths:
      - 'mobile-kolbo/**'
      - '.github/workflows/kolbo-v471-native-android.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify error categorization without external GPU
        run: |
          mkdir -p /tmp/kolbo-471-tests
          javac -d /tmp/kolbo-471-tests \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/ProviderErrorClassifier.java \
            mobile-kolbo/test/ProviderErrorClassifierTest.java
          java -cp /tmp/kolbo-471-tests com.kolbomusic.video.ProviderErrorClassifierTest
      - name: Verify native UI, recovery invariants, and translation
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('mobile-kolbo/app/src/main/java/com/kolbomusic/video')
          ui=(src/'MainActivity.java').read_text()
          provider=(src/'WanNativeClient.java').read_text()
          for x in ('כלבו וידאו AI','בדוק משימה קודמת','beforeSubmission()',
                    'FinalProviderRejection','getPreferences','putBoolean("uncertain_submission",false)'):
              assert x in ui,x
          for x in ('ProviderErrorClassifier.classify(data)',
                    'throw new FinalProviderRejection','/gradio_api/call/generate_video',
                    'HebrewActionTranslator.translate','getResponseCode'):
              assert x in provider,x
          assert 'WebView' not in ui
          assert 'duration.setSelection(0)' in ui, 'prefer short 2-second public GPU trial'
          assert "versionName '4.7.1'" in Path('mobile-kolbo/app/build.gradle').read_text()
          print('PASS: Hebrew native UI, error state cleanup, no WebView, local translation')
          PY
      - name: Provision Android 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build signed debug APK
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Verify Android package, signing and SHA256
        run: |
          APK=mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v4.7.1-Hebrew-Native-Error-Recovery-APK
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
