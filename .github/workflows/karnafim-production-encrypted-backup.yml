name: Karnafim encrypted production recovery backup (guarded)
# Manual-only until a protected source secret and an independent archive
# passphrase have been configured. Never enable on pull_request or on push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KARNAFIM_BACKUP_DATABASE_URL: ${{ secrets.KARNAFIM_BACKUP_DATABASE_URL }}
      KARNAFIM_BACKUP_PASSPHRASE: ${{ secrets.KARNAFIM_BACKUP_PASSPHRASE }}
    steps:
      - name: Abort without both protected secrets
        shell: bash
        run: |
          if [ -z "$KARNAFIM_BACKUP_DATABASE_URL" ] || [ -z "$KARNAFIM_BACKUP_PASSPHRASE" ]; then
            echo "::error::NOT_CONFIGURED: Protected backup DB URL or encryption secret missing. No production data was read."
            exit 1
          fi
          if [ "${#KARNAFIM_BACKUP_PASSPHRASE}" -lt 32 ]; then
            echo "::error::NOT_CONFIGURED: The encryption passphrase is too short. No production data was read."
            exit 1
          fi
      - name: Checkout the immutable validated backup implementation
        uses: actions/checkout@v4
        with:
          # Squash-merged commit validated by isolated PostgreSQL 18 CI.
          ref: e914d52bbe4b070ac4e3a5a1b731f8fdcb23d373
          persist-credentials: false
      - name: Create encrypted community recovery archive
        env:
          KARNAFIM_BACKUP_OUTPUT_DIR: ${{ runner.temp }}/karnafim-encrypted
        shell: bash
        run: bash karnafim-site/ops/backup_encrypted.sh
      - name: Upload ciphertext only (seven-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: karnafim-recovery-ciphertext-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/karnafim-encrypted/*.pgdump.gpg
            ${{ runner.temp }}/karnafim-encrypted/*.pgdump.gpg.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Remove remaining encrypted local files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/karnafim-encrypted"
