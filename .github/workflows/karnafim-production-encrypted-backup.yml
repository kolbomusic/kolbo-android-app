name: Karnafim encrypted production recovery backup (guarded)
# Daily checks are no-op unless both protected secrets are configured.
# Never enable on pull_request or push; never upload unencrypted data.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
permissions:
  contents: read
jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KARNAFIM_BACKUP_DATABASE_URL: ${{ secrets.KARNAFIM_BACKUP_DATABASE_URL }}
      KARNAFIM_BACKUP_PASSPHRASE: ${{ secrets.KARNAFIM_BACKUP_PASSPHRASE }}
      KARNAFIM_BACKUP_OUTPUT_DIR: ${{ runner.temp }}/karnafim-encrypted
    steps:
      - name: Check protected prerequisites without exposing them
        id: gate
        shell: bash
        run: |
          if [ -n "$KARNAFIM_BACKUP_DATABASE_URL" ] &&
             [ -n "$KARNAFIM_BACKUP_PASSPHRASE" ] &&
             [ "${#KARNAFIM_BACKUP_PASSPHRASE}" -ge 32 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Encrypted production backup prerequisites are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SKIPPED: Protected backup prerequisites are not configured; no production data read."
          fi
      - name: Checkout the immutable validated backup implementation
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # Squash-merged commit validated by isolated PostgreSQL 18 CI.
          ref: e914d52bbe4b070ac4e3a5a1b731f8fdcb23d373
          persist-credentials: false
      - name: Create encrypted community recovery archive
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: bash karnafim-site/ops/backup_encrypted.sh
      - name: Upload ciphertext only (seven-day retention)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: karnafim-recovery-ciphertext-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/karnafim-encrypted/*.pgdump.gpg
            ${{ runner.temp }}/karnafim-encrypted/*.pgdump.gpg.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Remove remaining encrypted local files
        if: steps.gate.outputs.ready == 'true' && always()
        run: rm -rf -- "${{ runner.temp }}/karnafim-encrypted"
