name: Kolbo original source end-to-end fallback MP4
on:
  push:
    branches: [kolbo-trance-studio-20261031]
    paths:
      - 'trance-studio/tests/live_source_smoke.py'
      - '.github/workflows/kolbo-original-source-live.yml'
  workflow_dispatch:
jobs:
  original-file-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify real cloud input SHA256 + no-action MP4
        run: python trance-studio/tests/live_source_smoke.py
