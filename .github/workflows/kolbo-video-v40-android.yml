name: Kolbo Video 4.0.7 offline audiovisual evidence review and honest QA
on:
  push:
    branches: [kolbo-video-v407-evidence-audio-qa-20261010]
    paths: ['.github/workflows/kolbo-video-v40-android.yml', 'kolbo-video-v40.src.b64', 'kolbo-video-v40.src.sha256', 'patches/kolbo-v401-repair.py', 'patches/kolbo-v402-identity-consent.py', 'patches/kolbo-v402-msr-connect.py', 'patches/MultiSubjectReferenceClient.java', 'patches/kolbo-v403-general-planner.py', 'patches/StoryboardPlanner.java', 'patches/ProviderFailure.java', 'patches/tests/StoryboardPlannerSmoke.java', 'patches/kolbo-v404-role-binding.py', 'patches/CharacterRoleContract.java', 'patches/tests/RoleAndActions404Smoke.java', 'patches/kolbo-v405-scene-isolation.py', 'patches/SceneIntentContract.java', 'patches/tests/SceneIntent405Smoke.java', 'patches/kolbo-v406-studio-polish.py', 'patches/kolbo-v406-quality-and-scene.py', 'patches/StudioVisuals.java', 'patches/OutputLengthGate.java', 'patches/DurationPolicy.java', 'patches/tests/Quality406Smoke.java', 'patches/kolbo-v407-evidence-integration.py', 'patches/VideoEvidenceAudit.java', 'patches/VideoEvidenceAuditRequest.java', 'patches/tests/Evidence407Smoke.java']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate source SHA256 and extract
        run: |
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import base64,hashlib,zipfile
          data=base64.b64decode(Path('kolbo-video-v40.src.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()==Path('kolbo-video-v40.src.sha256').read_text().strip()
          Path('source.zip').write_bytes(data)
          with zipfile.ZipFile('source.zip') as z:
            assert z.testzip() is None
            for item in z.infolist():
              path=PurePosixPath(item.filename)
              assert not path.is_absolute() and '..' not in path.parts
            z.extractall('android')
          PY
      - name: Apply verified v4.0.1 prompt and preview repair
        run: python3 patches/kolbo-v401-repair.py android
      - name: Apply v4.0.2 offline preview and unverified-identity guards
        run: python3 patches/kolbo-v402-identity-consent.py android
      - name: Add separate MSR public Gradio provider
        run: python3 patches/kolbo-v402-msr-connect.py android
      - name: Apply v4.0.3 storyboard planner and quota guard
        run: python3 patches/kolbo-v403-general-planner.py android
      - name: Apply v4.0.4 immutable character slots, actor-target locking, and Hebrew action parsing
        run: python3 patches/kolbo-v404-role-binding.py android
      - name: Apply v4.0.5 request-specific intent and inspectable prompts
        run: python3 patches/kolbo-v405-scene-isolation.py android
      - name: Apply v4.0.6 studio interface and fail-closed output validation
        run: python3 patches/kolbo-v406-studio-polish.py android
      - name: Apply v4.0.6 duet scene semantics and pure duration policy
        run: python3 patches/kolbo-v406-quality-and-scene.py android
      - name: Apply v4.0.7 offline evidence reviewer
        run: python3 patches/kolbo-v407-evidence-integration.py android
      - name: Compile and exercise standalone storyboard planner
        run: |
          mkdir -p build/storyboard-test
          javac -encoding UTF-8 -d build/storyboard-test android/app/src/main/java/com/kolbo/videostudio/StoryboardPlanner.java android/app/src/main/java/com/kolbo/videostudio/ProviderFailure.java android/app/src/main/java/com/kolbo/videostudio/CharacterRoleContract.java android/app/src/main/java/com/kolbo/videostudio/SceneIntentContract.java android/app/src/main/java/com/kolbo/videostudio/DurationPolicy.java android/app/src/main/java/com/kolbo/videostudio/VideoEvidenceAuditRequest.java patches/tests/StoryboardPlannerSmoke.java patches/tests/RoleAndActions404Smoke.java patches/tests/SceneIntent405Smoke.java patches/tests/Quality406Smoke.java patches/tests/Evidence407Smoke.java
          java -cp build/storyboard-test com.kolbo.videostudio.StoryboardPlannerSmoke
          java -cp build/storyboard-test com.kolbo.videostudio.RoleAndActions404Smoke
          java -cp build/storyboard-test com.kolbo.videostudio.SceneIntent405Smoke
          java -cp build/storyboard-test com.kolbo.videostudio.Quality406Smoke
          java -cp build/storyboard-test com.kolbo.videostudio.Evidence407Smoke
      - name: Static safeguards and prompt QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('android/app/src/main/java/com/kolbo/videostudio/MainActivity.java').read_text()
          composer=Path('android/app/src/main/java/com/kolbo/videostudio/TwoPersonComposer.java').read_text()
          deps=Path('android/app/build.gradle').read_text()
          assert 'preview407' in deps and "versionName '4.0.7'" in deps
          assert "segmentation-selfie:16.0.0-beta6" in deps and "face-detection:16.1.7" in deps
          assert "translated.trim().length()<3" in main
          assert "translated.trim().length()<10" not in main
          assert "TwoPersonComposer.compose(a,b)" in main
          assert "TwoPersonComposer.checkVideoCount(combined)" in main
          assert "place(c,paint,a,0,0,256,512)" not in main
          assert "Single shared scene" not in main
          assert 'if(fa!=1||fb!=1)' in composer
          assert 'if(count!=2)' in composer
          assert 'static final int W=512,H=512;' in composer
          assert 'place(c,left,132,H-24,210,448)' in composer
          assert 'place(c,right,380,H-24,210,448)' in composer
          assert 'max>2' in composer and '!sawTwo' in composer
          assert 'segmentation.close()' in composer and 'fd.close()' in composer
          assert "getWindow().getDecorView().setLayoutDirection" in main
          motion=Path("android/app/src/main/java/com/kolbo/videostudio/DuoDanceMotionGate.java").read_text()
          assert "DuoDanceMotionGate.requireVisibleDuoMovement(combined)" in main
          assert "wantsGroupDance(originalInstruction)" in main
          assert 'both dancers' in main.lower() or 'both figures' in main.lower()
          assert 'leftMedian>=MIN_CHANGED_FRACTION' in motion
          assert 'rightMedian>=MIN_CHANGED_FRACTION' in motion
          assert "MIN_CHANGED_FRACTION = 0.11" in motion
          assert 'לא בוצע אימות לשירה' in main
          assert 'NO additional bystanders. " + englishPrompt' not in main
          assert 'NO additional bystanders. " + scenePrompt' in main
          assert 'audioAfterVideo(combined,originalInstruction,motionWarning)' in main
          assert "versionCode 407" in deps
          assert 'private void previewDuoBeforeUpload(' in main
          assert 'final boolean unverified=identityReviewRequired;' in main
          assert 'טיוטת AI לא מאומתת' in main
          assert 'imageMeta=uploadImageBytes(reference!=null?reference:jointReference(first,second)' in main
          assert 'photoOnePreview.setImageURI(image)' in main
          assert 'photoTwoPreview.setImageURI(imageTwo)' in main
          assert 'MultiSubjectReferenceClient.generate(firstBytes,firstMime,secondBytes,secondMime' in main
          assert 'startMSRVideo(enhanced,chosen,second,instruction,requestedSeconds)' in main
          assert 'useMultiReferenceProvider=true' in main
          msr=Path('android/app/src/main/java/com/kolbo/videostudio/MultiSubjectReferenceClient.java').read_text()
          assert 'p.put(ref1);p.put(ref2);' in msr
          assert 'hugging-apps-ltx25-multi-subject-reference.hf.space' in msr
          assert 'p.put((double)seconds)' in msr
          assert 'MSR' in msr
          assert 'StoryboardPlanner.plan(translatedPrompt,desiredSeconds)' in main
          assert 'StoryboardPlanner.plan(englishPrompt,requestedSeconds)' in main
          assert 'ProviderFailure.explain(e)' in main
          assert 'showResult(clips.get(0)' not in main
          assert 'CharacterRoleContract.from(originalInstruction)' in main
          assert 'styleConstraints+roleLock.prompt(scene.action' in main
          assert 'String scenePrompt=common+' not in main
          assert 'CharacterRoleContract.from(request).preview()' in main
          assert 'HEBREW_ACTION_BREAK' in Path('android/app/src/main/java/com/kolbo/videostudio/StoryboardPlanner.java').read_text()
          assert 'sceneIntent.sceneSetting()' in main
          assert 'recordSubmittedPrompt("MSR reference slots 1+2"' in main
          assert 'lastSubmittedPrompt="";originalForDiagnostics=instruction' in main
          assert 'הצג אבחון טכני' in main
          assert "MUSIC_PERFORMANCE" in Path('android/app/src/main/java/com/kolbo/videostudio/SceneIntentContract.java').read_text()
          assert 'OutputLengthGate.verify(file,expectedDuration)' in main
          assert 'OutputLengthGate.verify(clip,secs)' in main
          assert 'OutputLengthGate.verify(file,seconds)' in main
          assert 'new StudioVisuals.AmbientMotionView(this)' in main
          assert 'waitingCard.setVisibility(b?View.VISIBLE:View.GONE)' in main
          assert 'resultCard.setVisibility(View.VISIBLE)' in main
          assert 'lastPhaseDetail' in main
          assert 'class StudioVisuals' in Path('android/app/src/main/java/com/kolbo/videostudio/StudioVisuals.java').read_text()
          assert 'DurationPolicy.acceptable' in Path('android/app/src/main/java/com/kolbo/videostudio/OutputLengthGate.java').read_text()
          assert 'VideoEvidenceAudit.inspect(' in main
          assert 'lastQualityEvidence=evidence.details()' in main
          assert 'status.setText(qualityHeadline)' in main
          audit=Path('android/app/src/main/java/com/kolbo/videostudio/VideoEvidenceAudit.java').read_text()
          assert 'MediaExtractor' in audit and 'FaceDetection.getClient' in audit
          assert 'לא אומתה זהות הפנים' in audit
          print('PASS: separate foreground masks, scene composition, photo face count, short Hebrew')
          PY
      - name: Test rejecting still subjects but not two moving subjects
        run: |
          python3 -m pip install -q opencv-python-headless
          python3 -m unittest discover -s android/tests -v
      - name: Assemble Android APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and app identifier
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q 'com.kolbo.videostudio.preview407'
          sha256sum "$APK" | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-4.0.7-Offline-Evidence-QA-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          retention-days: 14
