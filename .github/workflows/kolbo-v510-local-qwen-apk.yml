name: Kolbo Video v5.1 Local Qwen LiteRT-LM APK
on:
  push:
    branches: [kolbo-video-v510-local-qwen-planner-20261014]
    paths:
      - mobile-kolbo/**
      - .github/workflows/kolbo-v510-local-qwen-apk.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android-local-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Check dynamic LLM contract on JVM without any model download
        run: |
          curl -fLsS --retry 2 --max-time 25 -o /tmp/json.jar \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p /tmp/kolbo-llm-tests
          javac -encoding UTF-8 -cp /tmp/json.jar -d /tmp/kolbo-llm-tests \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/HebrewIntentBrain.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/V5SceneContract.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/QwenPlanContract.java \
            mobile-kolbo/test/QwenPlanContractTest.java
          java -cp /tmp/kolbo-llm-tests:/tmp/json.jar com.kolbomusic.video.QwenPlanContractTest
      - name: Verify pinned legal free model, no paid LLM endpoint, and fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path("mobile-kolbo/app/src/main/java/com/kolbomusic/video")
          manager=(app/"LocalBrainModelManager.java").read_text()
          kotlin=(app/"QwenScenePlanner.kt").read_text()
          video=(app/"WanNativeClient.java").read_text()
          ui=(app/"MainActivity.java").read_text()
          for s in ("EXPECTED_SIZE=347251840L","2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139",
                    "NETWORK_WIFI","SHA-256","DownloadManager"):
            assert s in manager,s
          for s in ("EngineConfig","Backend.CPU()","conversation.sendMessage",
                    "LocalBrainModelManager.isVerified","FILM SCENE PLANNER"):
            assert s in kotlin,s
          assert video.index("QwenScenePlanner.plan(")<video.index("String path=upload(")
          assert "QwenPlanContract.compile(contract,localAdvice)" in video
          assert "V5SourceAudit.examine" in video
          assert "scene.photoCleanup" not in video[video.index("V5SceneContract contract="):]
          assert "offerLocalBrainInstallation()" in ui
          assert "WebView" not in ui
          assert "versionName '5.1.0'" in Path("mobile-kolbo/app/build.gradle").read_text()
          print("PASS: free local model, model-hash verification, no GPU cost, no user-data API")
          PY
      - name: Provision Android 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Compile Qwen LiteRT-LM native integration and package Android APK
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Verify signed APK package version and checksum
        run: |
          APK=mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -15
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v5.1-Local-Qwen-Brain-APK
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
