name: Diagnose public Facebook short-share browser resolution
on:
  push:
    branches:
      - kolbo-trance-public-short-share-real-qa-20261102
    paths:
      - 'trance-studio/tests/diagnose_facebook_public_share_v_profiles.py'
      - '.github/workflows/kolbo-facebook-short-link-resolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'curl-cffi==0.17.0'
      - name: Compare bounded public share URL redirects without cookies or login
        run: python trance-studio/tests/diagnose_facebook_public_share_v_profiles.py
