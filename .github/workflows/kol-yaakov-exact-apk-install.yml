name: Kol Yaakov Exact Signed APK Install Test

on:
  push:
    branches:
      - build/kol-yaakov-native-android-v0.4.1
    paths:
      - '.github/test-fixtures/exact_*.b64'
      - '.github/workflows/kol-yaakov-exact-apk-install.yml'
  workflow_dispatch:

jobs:
  exact-install:
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          cat .github/test-fixtures/exact_*.b64 | base64 -d > Kol-Yaakov-Android-v0.4.1-SAFE-CHECKED.apk
          echo "65d6467df2888be89a9d31f4852e51b725ee2f9803f5a1ddcecd4286110bafe2  Kol-Yaakov-Android-v0.4.1-SAFE-CHECKED.apk" | sha256sum -c -
          unzip -t Kol-Yaakov-Android-v0.4.1-SAFE-CHECKED.apk >/dev/null

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install exact signed APK on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          heap-size: 512M
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb install -r Kol-Yaakov-Android-v0.4.1-SAFE-CHECKED.apk
            adb shell pm path com.ofirgilboa.kolyaakov
            adb shell dumpsys package com.ofirgilboa.kolyaakov > /tmp/pkg.txt
            grep -q 'android.permission.VIBRATE' /tmp/pkg.txt
            ! grep -q 'android.permission.INTERNET' /tmp/pkg.txt
            adb shell am start -W -n com.ofirgilboa.kolyaakov/.MainActivity | tee /tmp/launch.txt
            grep -Eq 'Status: ok|Complete' /tmp/launch.txt
            sleep 2
            test -n "$(adb shell pidof com.ofirgilboa.kolyaakov | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q 'com.ofirgilboa.kolyaakov/.MainActivity'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -q 'קול יעקב' /tmp/window.xml
            adb install -r Kol-Yaakov-Android-v0.4.1-SAFE-CHECKED.apk
            adb shell am force-stop com.ofirgilboa.kolyaakov
            adb shell am start -W -n com.ofirgilboa.kolyaakov/.MainActivity > /tmp/relaunch.txt
            grep -Eq 'Status: ok|Complete' /tmp/relaunch.txt
            echo EXACT_SIGNED_APK_INSTALL_PASS
