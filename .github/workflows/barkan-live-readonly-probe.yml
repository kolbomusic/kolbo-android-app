name: Barkan public live endpoint diagnostic
on:
  push:
    branches: [karnafim-barkan-rebuild-20261102]
    paths:
      - '.github/workflows/barkan-live-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public Render HTTP endpoints (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          sites = [
              "karnafim-community-46.onrender.com",
              "karnafim-barkan-46.onrender.com",
          ]
          results = []
          for host in sites:
              for path in ("/health", "/ready", "/"):
                  url = "https://" + host + path
                  result = {"url": url, "http_status": None, "final_url": None}
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "KarnafimReadOnlyHealth/1.0"}
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=32) as response:
                          result["http_status"] = response.status
                          result["final_url"] = response.url
                          result["content_type"] = response.headers.get("Content-Type","")
                          body = response.read(4096)
                          if path in ("/health","/ready"):
                              try:
                                  data=json.loads(body)
                                  if isinstance(data, dict):
                                      for field in ("status","auth_enabled",
                                                    "member_portal","database_configured",
                                                    "signup_enabled","registration_mode",
                                                    "email_delivery_release_verified"):
                                          if field in data:
                                              result[field]=data[field]
                              except (ValueError, UnicodeError, TypeError):
                                  pass
                  except urllib.error.HTTPError as exc:
                      result["http_status"] = exc.code
                      result["final_url"] = exc.url
                      result["error"] = "HTTPError"
                  except (OSError, TimeoutError) as exc:
                      result["error"] = type(exc).__name__
                  results.append(result)
                  print(json.dumps(result, ensure_ascii=False), flush=True)

          Path("barkan-live-readonly-report.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2)+"\n",
              encoding="utf-8"
          )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a",encoding="utf-8") as file:
                  file.write("## Barkan read-only production endpoint report\n\n")
                  file.write("| Endpoint | HTTP | Status |\n|---|---:|---|\n")
                  for x in results:
                      status=x.get("status",x.get("member_portal",x.get("error","")))
                      file.write(f'| {x["url"]} | {x["http_status"]} | {status} |\n')
                  file.write("\nNo authentication or private data access attempted.\n")

          new_health=next(x for x in results if x["url"]==
              "https://karnafim-barkan-46.onrender.com/health")
          if new_health.get("http_status")!=200 or new_health.get("status")!="ok":
              raise SystemExit("New dynamic Render service is not verified healthy")
          PY
      - name: Inspect public auth routes, headers, and Google site status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          results=[]
          for host in ("karnafim-community-46.onrender.com",
                       "karnafim-barkan-46.onrender.com"):
              for path in ("/login","/signup","/profile","/find","/inbox","/media/1"):
                  result={"host":host,"path":path,"http":None}
                  req=urllib.request.Request("https://"+host+path,
                      headers={"User-Agent":"KarnafimReadOnlySecurity/1.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=24) as resp:
                          result["http"]=resp.status
                          result["final_host"]=urllib.parse.urlsplit(resp.url).hostname
                          result["final_path"]=urllib.parse.urlsplit(resp.url).path
                          result["csp"]=bool(resp.headers.get("Content-Security-Policy"))
                          result["nosniff"]=resp.headers.get("X-Content-Type-Options")=="nosniff"
                  except urllib.error.HTTPError as exc:
                      result["http"]=exc.code
                  except (OSError,TimeoutError) as exc:
                      result["error"]=type(exc).__name__
                  results.append(result)
                  print("ROUTE_SECURITY="+json.dumps(result,ensure_ascii=False),flush=True)
          domain="karnafim-community-46.onrender.com"
          google={"host":domain,"classification":"unverified"}
          url="https://transparencyreport.google.com/transparencyreport/api/v3/safebrowsing/status?site="+domain
          try:
              req=urllib.request.Request(url,
                   headers={"User-Agent":"Mozilla/5.0 (compatible; KarnafimReadOnly/1.0)"})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  raw=resp.read(100000).decode("utf-8","replace")
              i=raw.find("[[")
              if i<0:raise ValueError("Google status response shape")
              rows=json.loads(raw[i:])
              if not rows or not isinstance(rows[0],list) or rows[0][0]!="sb.ssr":
                  raise ValueError("Unrecognized Google status response")
              code=int(rows[0][1])
              google["classification"]={1:"no_unsafe_content_found",
                  2:"unsafe",3:"some_pages_unsafe",5:"uncommon_downloads",
                  6:"no_available_data"}.get(code,"unverified")
              google["phishing_signal"]=bool(rows[0][4])
          except (OSError,TimeoutError,ValueError,IndexError,TypeError) as exc:
              google["error"]=type(exc).__name__
          print("GOOGLE_PUBLIC_STATUS="+json.dumps(google,ensure_ascii=False),flush=True)
          PY
      - name: Keep safe diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barkan-live-readonly-report
          path: barkan-live-readonly-report.json
          retention-days: 7
          if-no-files-found: warn
