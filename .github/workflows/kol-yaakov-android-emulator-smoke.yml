name: Kol Yaakov Android Install Smoke Test

on:
  push:
    branches:
      - build/kol-yaakov-native-android-v0.4.2
    paths:
      - 'kol-yaakov-native/**'
      - '.github/workflows/kol-yaakov-android-emulator-smoke.yml'
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK from same native source
        working-directory: kol-yaakov-native
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Boot Android 16 emulator and verify install + launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          heap-size: 512M
          working-directory: kol-yaakov-native
          script: |
            set -eu
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -q 'package:com.ofirgilboa.kolyaakov'
            adb shell am start -W -n com.ofirgilboa.kolyaakov/.MainActivity | tee /tmp/launch.txt
            grep -Eq 'Status: ok|Complete' /tmp/launch.txt
            sleep 3
            test -n "$(adb shell pidof com.ofirgilboa.kolyaakov | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q 'com.ofirgilboa.kolyaakov/.MainActivity'
            adb shell dumpsys package com.ofirgilboa.kolyaakov > /tmp/package.txt
            grep -q 'android.permission.VIBRATE' /tmp/package.txt
            ! grep -q 'android.permission.INTERNET' /tmp/package.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -q 'קול יעקב' /tmp/window.xml
            adb shell pm clear com.ofirgilboa.kolyaakov
            adb shell am start -W -n com.ofirgilboa.kolyaakov/.MainActivity >/tmp/relaunch.txt
            grep -Eq 'Status: ok|Complete' /tmp/relaunch.txt
            echo 'ANDROID_INSTALL_SMOKE_PASS'
