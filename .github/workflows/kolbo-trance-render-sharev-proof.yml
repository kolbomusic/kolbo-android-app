name: Prove real Render Facebook share-v media import
on:
  push:
    branches:
      - kolbo-trance-live-render-shortshare-proof-20261102
      - kolbo-trance-studio-20261031
    paths:
      - 'trance-studio/tests/live_real_facebook_render_shortshare.py'
      - 'trance-studio/backend/link_import.py'
      - 'trance-studio/web/studio.html'
      - '.github/workflows/kolbo-trance-render-sharev-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-sharev-to-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real MP4 codec verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
      # Post-deploy verification after Render confirmed live (2026-11-02).
      - name: Verify deployed mobile recovery UI is serving the current version
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          url="https://kolbo-trance-studio.onrender.com/studio"
          with urlopen(Request(url,headers={"User-Agent":"KolboQA/1.0"}),timeout=90) as response:
              page=response.read(500000).decode("utf-8","replace")
          assert 'id="linkRecovery" hidden' in page, "Render is still serving previous import UI"
          assert 'id="chooseRecoveredVideo"' in page
          print("PRODUCTION_FACEBOOK_RECOVERY_UI_IS_DEPLOYED_PASS")
          PY
      - name: Real production site -> authenticated share/v import -> downloaded media -> ffprobe
        run: python trance-studio/tests/live_real_facebook_render_shortshare.py
