name: Kolbo external GPU provider lease gate tests
on:
  push:
    branches: [kolbo-video-v459-public-gpu-api-probe-20261013]
    paths:
      - 'gpu-discovery/provider_readiness.py'
      - 'gpu-discovery/test_provider_readiness.py'
      - '.github/workflows/kolbo-gpu-provider-lease-gate.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s gpu-discovery -p test_provider_readiness.py -v
