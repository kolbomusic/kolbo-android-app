name: Kolbo Trance ASR Docker image preload verification
on:
  push:
    branches: [kolbo-trance-asr-warm-cache-20261101]
    paths:
      - 'trance-studio/Dockerfile'
      - 'trance-studio/backend/requirements.txt'
      - 'trance-studio/backend/source_asr.py'
      - '.github/workflows/kolbo-trance-asr-image.yml'
  workflow_dispatch:
jobs:
  build-preloaded-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build complete Docker image, including quantized free Whisper weights
        run: docker build --pull -t kolbo-trance-asr:test trance-studio
      - name: Confirm weights and CPU inference work offline within 512 MB
        run: |
          docker run --rm --memory=512m --cpus=1 -e HF_HUB_OFFLINE=1 --entrypoint python kolbo-trance-asr:test -c "import os;from pathlib import Path;from faster_whisper import WhisperModel;p=Path(os.environ['KOLBO_ASR_DIR'])/'model.bin';assert p.stat().st_size>1000000,p;m=WhisperModel(str(p.parent),device='cpu',compute_type='int8',cpu_threads=1);print('MODEL_PRELOADED_AND_LOADED',p.stat().st_size)"
