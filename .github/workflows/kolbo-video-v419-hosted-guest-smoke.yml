name: Kolbo v419 - Hosted restricted guest CPU smoke (synthetic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate no-key guest enrollment, rights, video output and cross-device isolation
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,secrets,struct,time,urllib.error,urllib.request,zlib
          base="https://kolbo-video-wan416-staging.onrender.com"
          def request(method,path,data=None,token=None):
              payload=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request(base+path,payload,method=method)
              if payload is not None:req.add_header("Content-Type","application/json")
              if token:req.add_header("Authorization","Bearer "+token)
              try:
                  with urllib.request.urlopen(req,timeout=45) as rsp:
                      return rsp.status,rsp.read()
              except urllib.error.HTTPError as e:return e.code,e.read()
          for _ in range(5):
              try:
                  code,raw=request("GET","/healthz")
                  if code==200 and json.loads(raw)["alive"]:break
              except Exception:pass
              time.sleep(5)
          else:raise AssertionError("Hosted health unavailable")
          code,_=request("GET","/v1/health")
          assert code==401,code
          c,raw=request("POST","/v1/guest/bootstrap",{"install_id":secrets.token_hex(16)})
          assert c==200,(c,raw[:120])
          one=json.loads(raw)["token"]
          c,raw=request("POST","/v1/guest/bootstrap",{"install_id":secrets.token_hex(16)})
          assert c==200
          two=json.loads(raw)["token"]
          c,raw=request("GET","/v1/health",token=one)
          info=json.loads(raw)
          assert c==200 and info["status"]=="not_ready"
          assert info["cpu_photo_studio"]["ai_video"] is False
          c,_=request("POST","/v1/jobs",{"prompt":"Someone sings a song","seconds":3.5,"images":[]},token=one)
          assert c==401,c
          width,height=96,96
          pixels=b"".join(b"\x00"+bytes((x*3%256,y*3%256,(x+y)%256) for x in range(width) for _ in range(1))
                          for y in range(height))
          # Correct byte count and scanline filter prefix.
          assert len(pixels)==height*(1+width*3)
          def chunk(tag,data):
              return struct.pack("!I",len(data))+tag+data+struct.pack("!I",zlib.crc32(tag+data))
          png=(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack("!IIBBBBB",width,height,8,2,0,0,0))
               +chunk(b"IDAT",zlib.compress(pixels))+chunk(b"IEND",b""))
          body={"mode":"cpu_photo_motion","seconds":2,
                "media_rights_attested":True,
                "images":[{"mime_type":"image/png","data_base64":base64.b64encode(png).decode()}]}
          c,raw=request("POST","/v1/studio/jobs",body,token=one)
          assert c==202,(c,raw[:160])
          job=json.loads(raw)["job_id"]
          c,_=request("GET","/v1/jobs/"+job,token=two)
          assert c==404,c
          for _ in range(20):
              c,raw=request("GET","/v1/jobs/"+job,token=one)
              assert c==200,(c,raw[:160])
              current=json.loads(raw)
              if current["state"] in ("completed","failed"):break
              time.sleep(3)
          assert current["state"]=="completed",current
          c,mp4=request("GET","/v1/jobs/"+job+"/result",token=one)
          assert c==200 and len(mp4)>3000 and mp4[4:8]==b"ftyp"
          print("PASS: Render hosted CPU photo MP4, anonymous auto-bootstrap, authenticated owner isolation, GPU denied, MP4 bytes",len(mp4))
          PY
