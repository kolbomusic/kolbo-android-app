name: Kolbo v431 - Inspect public LTX-2.5 native AV API (no GPU job)
on:
  push:
    branches: [kolbo-video-v431-native-av-zerogpu-20261011]
    paths: [".github/workflows/kolbo-v431-ltx-api-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free client only
        run: python -m pip install -q 'gradio_client>=2,<3'
      - name: Inspect LTX-2.5 no-GPU public Gradio schema
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python .github/scripts/kolbo_ltx25_api_probe_v431.py
