name: Kolbo Live Studio Windows Build
on:
  push:
    branches: [chatgpt-kolbo-live-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.318'
      - name: Restore
        shell: pwsh
        run: dotnet restore src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj
      - name: Build Windows
        shell: pwsh
        run: dotnet build src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj -c Release -p:EnableWindowsTargeting=true --no-restore
      - name: Publish self-contained
        shell: pwsh
        run: dotnet publish src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o publish
      - name: Upload publish
        uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Live-Studio-Preview-0.1.5-Publish
          path: publish