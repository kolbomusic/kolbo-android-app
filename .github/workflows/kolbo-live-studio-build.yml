name: Kolbo Live Studio Windows Release
on:
  push:
    branches: [chatgpt-kolbo-live-build]

permissions:
  contents: read

concurrency:
  group: kolbo-live-studio-windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.318'

      - name: Restore
        shell: pwsh
        working-directory: klswork
        run: dotnet restore src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj

      - name: Build Windows
        shell: pwsh
        working-directory: klswork
        run: dotnet build src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj -c Release --no-restore

      - name: Release source contract gate
        shell: pwsh
        working-directory: klswork
        run: |
          $xaml=Get-Content src/Kolbo.Live.Windows/MainWindow.xaml -Raw
          $code=Get-Content src/Kolbo.Live.Windows/MainWindow.xaml.cs -Raw
          $engine=Get-Content src/Kolbo.Live.Windows/AsioCaptureEngine.cs -Raw
          $media=Get-Content src/Kolbo.Live.Windows/MediaSourceService.cs -Raw
          $export=Get-Content src/Kolbo.Live.Windows/ExportService.cs -Raw
          $app=Get-Content src/Kolbo.Live.Windows/App.xaml -Raw
          $phone=Get-Content src/Kolbo.Live.Windows/PhonePairingServer.cs -Raw

          if(-not (($xaml -match 'WindowStyle="SingleBorderWindow"') -and ($xaml -match 'ResizeMode="CanResizeWithGrip"'))){ throw 'native window frame contract failed' }
          if(-not (($app -match 'TextElement.Foreground="White"') -and ($app -match 'Background="#23334F"'))){ throw 'contrast contract failed' }
          if(-not (($xaml -match 'LoadYouTube_Click') -and ($media -match 'yt-dlp.exe'))){ throw 'YouTube contract failed' }
          if(-not (($xaml -match 'ExportAudio_Click') -and ($export -match 'ExportAudioAsync'))){ throw 'audio export contract failed' }
          if(-not (($xaml -match 'ExportVideo_Click') -and ($export -match 'ExportVideoAsync'))){ throw 'video export contract failed' }
          if(-not (($xaml -match 'ExportProgressBar') -and ($export -match 'out_time_ms='))){ throw 'export progress contract failed' }
          if(-not (($code -match 'MixGain_ValueChanged') -and ($engine -match 'UpdateGains'))){ throw 'live mic/playback balance contract failed' }
          if(-not (($phone -match 'navigator.mediaDevices.getUserMedia') -and ($phone -match 'MediaRecorder') -and ($phone -match 'Kolbo.Live.Tunnel.exe') -and ($phone -match 'WebSocket'))){ throw 'secure live browser camera contract failed' }
          if(-not (($code -match 'probe.Inputs.Count == 10') -and ($code -match 'effectGateFailed'))){ throw 'MR816 documented 10x10 wet-return contract failed' }
          Write-Host 'Release source contract PASS'

      - name: Core acceptance tests
        shell: pwsh
        working-directory: klswork
        run: dotnet run --project tests/Kolbo.Live.Tests/Kolbo.Live.Tests.csproj -c Release

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: klswork
        run: |
          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj -c Release -r win-x64 --self-contained true -o release/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (-not (Test-Path release/publish/Kolbo.Live.Windows.exe)) { throw "published EXE missing" }

      - name: Add verified FFmpeg payload
        shell: pwsh
        working-directory: klswork
        run: |
          $zipUrl='https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -UseBasicParsing -Uri ($zipUrl+'.sha256') -OutFile ffmpeg.sha256
          Invoke-WebRequest -UseBasicParsing -Uri $zipUrl -OutFile ffmpeg.zip
          $m=[regex]::Match((Get-Content ffmpeg.sha256 -Raw),'(?i)\b[0-9a-f]{64}\b')
          if (-not $m.Success) { throw "FFmpeg SHA-256 missing" }
          $actual=(Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($actual -ne $m.Value) { throw "FFmpeg SHA-256 mismatch" }

          Expand-Archive ffmpeg.zip ffmpeg-expanded -Force
          $ffmpeg=Get-ChildItem ffmpeg-expanded -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          $ffprobe=Get-ChildItem ffmpeg-expanded -Recurse -Filter ffprobe.exe -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries missing" }

          New-Item release/publish/tools -ItemType Directory -Force | Out-Null
          Copy-Item $ffmpeg.FullName release/publish/tools/ffmpeg.exe
          Copy-Item $ffprobe.FullName release/publish/tools/ffprobe.exe

          @(
            'Kolbo Live Studio Preview 0.2.0'
            ('FFmpeg archive SHA-256: '+$actual.ToLowerInvariant())
            'NAudio 3.1.0 and QRCoder 1.6.0 restored from NuGet'
          ) | Set-Content release/publish/THIRD-PARTY-BUILD-PROVENANCE.txt -Encoding UTF8

      - name: Add verified yt-dlp payload
        shell: pwsh
        working-directory: klswork
        run: |
          $base='https://github.com/yt-dlp/yt-dlp/releases/latest/download'
          Invoke-WebRequest -UseBasicParsing -Uri ($base+'/yt-dlp.exe') -OutFile yt-dlp.exe
          Invoke-WebRequest -UseBasicParsing -Uri ($base+'/SHA2-256SUMS') -OutFile yt-dlp.sha256

          $line=Get-Content yt-dlp.sha256 | Where-Object { $_ -match 'yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw "yt-dlp SHA-256 line missing" }
          $expected=($line -split '\s+')[0]
          $actual=(Get-FileHash yt-dlp.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "yt-dlp SHA-256 mismatch" }

          New-Item release/publish/tools -ItemType Directory -Force | Out-Null
          Copy-Item yt-dlp.exe release/publish/tools/yt-dlp.exe
          Add-Content release/publish/THIRD-PARTY-BUILD-PROVENANCE.txt ('yt-dlp latest verified SHA-256: '+$actual.ToLowerInvariant())

      - name: Add verified cloudflared payload
        shell: pwsh
        working-directory: klswork
        run: |
          $url='https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-windows-amd64.exe'
          $expected='2837888cc0f5d58f15b6dc478376de90b4d3ba5241c7947455d1e0a0df429712'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile cloudflared.exe
          $actual=(Get-FileHash cloudflared.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "cloudflared SHA-256 mismatch" }
          New-Item release/publish/tools -ItemType Directory -Force | Out-Null
          Copy-Item cloudflared.exe release/publish/tools/Kolbo.Live.Tunnel.exe
          Add-Content release/publish/THIRD-PARTY-BUILD-PROVENANCE.txt ('cloudflared 2026.9.1 SHA-256: '+$actual)

      - name: Verify bundled media tools
        shell: pwsh
        working-directory: klswork
        run: |
          & release/publish/tools/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "bundled FFmpeg failed to start" }
          & release/publish/tools/yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "bundled yt-dlp failed to start" }
          & release/publish/tools/Kolbo.Live.Tunnel.exe --version
          if ($LASTEXITCODE -ne 0) { throw "bundled Kolbo camera tunnel failed to start" }

      - name: Phone camera JavaScript syntax gate
        shell: pwsh
        working-directory: klswork
        run: |
          $source=Get-Content src/Kolbo.Live.Windows/PhonePairingServer.cs -Raw
          $m=[regex]::Match($source,'(?s)<script>(.*?)</script>')
          if(-not $m.Success){ throw "phone camera script not found" }
          $m.Groups[1].Value | Set-Content phone-camera.js -Encoding UTF8
          node --check phone-camera.js
          if($LASTEXITCODE -ne 0){ throw "phone camera JavaScript syntax failed" }

      - name: Real export smoke test
        shell: pwsh
        working-directory: klswork
        run: |
          dotnet build tests/Kolbo.Export.Smoke/Kolbo.Export.Smoke.csproj -c Release
          if($LASTEXITCODE -ne 0){ throw "export smoke test build failed" }
          $out='tests/Kolbo.Export.Smoke/bin/Release/net9.0'
          New-Item (Join-Path $out 'tools') -ItemType Directory -Force | Out-Null
          Copy-Item release/publish/tools/ffmpeg.exe (Join-Path $out 'tools/ffmpeg.exe')
          dotnet run --project tests/Kolbo.Export.Smoke/Kolbo.Export.Smoke.csproj -c Release --no-build
          if($LASTEXITCODE -ne 0){ throw "real export smoke test failed" }

      - name: Install NSIS
        shell: pwsh
        working-directory: klswork
        run: |
          choco install nsis -y --no-progress
          $candidates=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')
          $exe=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { $exe=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw "makensis.exe not found" }
          Set-Content nsis-path.txt $exe -Encoding ASCII

      - name: Generate uninstall ownership list
        shell: pwsh
        working-directory: klswork
        run: |
          $publish=(Resolve-Path release/publish).Path
          $lines=New-Object 'System.Collections.Generic.List[string]'

          Get-ChildItem $publish -Recurse -File | Sort-Object {$_.FullName.Length} -Descending | ForEach-Object {
            $rel=$_.FullName.Substring($publish.Length).TrimStart('\').Replace('/','\')
            $lines.Add(('  Delete "$INSTDIR\{0}"' -f $rel))
          }

          Get-ChildItem $publish -Recurse -Directory | Sort-Object {$_.FullName.Length} -Descending | ForEach-Object {
            $rel=$_.FullName.Substring($publish.Length).TrimStart('\').Replace('/','\')
            $lines.Add(('  RMDir "$INSTDIR\{0}"' -f $rel))
          }

          $lines | Set-Content packaging/uninstall-files.generated.nsh -Encoding UTF8

      - name: Build Setup.exe
        shell: pwsh
        working-directory: klswork
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          $makensis=(Get-Content nsis-path.txt -Raw).Trim()
          $payload=(Resolve-Path release/publish).Path.Replace('\','/')
          $output=(Join-Path (Resolve-Path dist).Path 'Kolbo-Live-Studio-Preview-0.2.0-Setup.exe').Replace('\','/')

          Push-Location packaging
          try {
            & $makensis ('-DPAYLOAD='+$payload) ('-DOUTPUT='+$output) installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path dist/Kolbo-Live-Studio-Preview-0.2.0-Setup.exe)) { throw "Setup.exe missing" }
          $hash=(Get-FileHash dist/Kolbo-Live-Studio-Preview-0.2.0-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash+'  Kolbo-Live-Studio-Preview-0.2.0-Setup.exe') | Set-Content dist/Kolbo-Live-Studio-Preview-0.2.0-Setup.exe.sha256.txt -Encoding ASCII

      - name: Installer and application smoke test
        shell: pwsh
        working-directory: klswork
        run: |
          $setup=(Resolve-Path dist/Kolbo-Live-Studio-Preview-0.2.0-Setup.exe).Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\KolboLiveStudio'

          Get-Process Kolbo.Live.Windows -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }

          New-Item $install -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $install 'STALE-FROM-OLD-PREVIEW.txt') 'old' -Encoding ASCII

          $p=Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install exit code $($p.ExitCode)" }

          $app=Join-Path $install 'Kolbo.Live.Windows.exe'
          if (-not (Test-Path $app)) { throw "installed EXE missing" }
          if (Test-Path (Join-Path $install 'STALE-FROM-OLD-PREVIEW.txt')) { throw "installer did not clean stale previous-preview files" }

          $version=(Get-Content (Join-Path $install 'VERSION.txt') -Raw).Trim()
          if ($version -ne 'Kolbo Live Studio Preview 0.2.0') { throw "installed version stamp mismatch: $version" }

          if (-not (Test-Path (Join-Path $install 'tools\ffmpeg.exe'))) { throw "installed FFmpeg missing" }
          if (-not (Test-Path (Join-Path $install 'tools\yt-dlp.exe'))) { throw "installed yt-dlp missing" }
          if (-not (Test-Path (Join-Path $install 'tools\Kolbo.Live.Tunnel.exe'))) { throw "installed Kolbo camera tunnel missing" }

          & (Join-Path $install 'tools\yt-dlp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed yt-dlp failed to start" }
          & (Join-Path $install 'tools\Kolbo.Live.Tunnel.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed Kolbo camera tunnel failed to start" }

          if (Get-Process Kolbo.Live.Windows -ErrorAction SilentlyContinue) { throw "application unexpectedly running after silent install" }

          $run=Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          $run.Refresh()
          if ($run.HasExited) { throw "application exited during startup smoke test with code $($run.ExitCode)" }

          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
            $bmp.Save((Join-Path (Resolve-Path dist).Path 'UI-SMOKE-0.2.0.png'))
            $g.Dispose()
            $bmp.Dispose()
          }
          catch {
            Write-Warning ("UI screenshot unavailable: "+$_.Exception.Message)
          }

          # Deliberately leave the application running: the uninstaller must close it
          # itself so users never need Task Manager just to update/remove Kolbo.
          $u=Start-Process (Join-Path $install 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "silent uninstall exit code $($u.ExitCode)" }

          Start-Sleep -Seconds 3
          if (Get-Process Kolbo.Live.Windows -ErrorAction SilentlyContinue) { throw "uninstaller left application process running" }
          if (Get-Process Kolbo.Live.Tunnel -ErrorAction SilentlyContinue) { throw "uninstaller left camera tunnel process running" }
          if (Test-Path $install) { throw "install directory remained after uninstall" }

      - name: Write QA report
        shell: pwsh
        working-directory: klswork
        run: |
          @(
            'Kolbo Live Studio Preview 0.2.0 - Windows Release QA'
            'Windows build: PASS'
            'Release source contracts: PASS'
            'Core acceptance tests: 8/8 PASS'
            'Self-contained win-x64 publish: PASS'
            'FFmpeg SHA-256 verification: PASS'
            'yt-dlp SHA-256 verification: PASS'
            'cloudflared 2026.9.1 pinned SHA-256 verification: PASS'
            'Bundled FFmpeg / yt-dlp / Kolbo.Live.Tunnel startup: PASS'
            'Phone camera JavaScript syntax: PASS'
            'Actual WAV+MP3 export smoke: PASS'
            'Actual MP4 export smoke: PASS'
            'Export progress reaches completion: PASS'
            'NSIS Setup.exe creation: PASS'
            'Silent install: PASS'
            'Clean replacement of stale previous-preview files: PASS'
            'WPF application startup smoke test: PASS'
            'Uninstall while application is running: PASS'
            'No Kolbo app/tunnel process remains after uninstall: PASS'
            'Native minimize / maximize / close / resize: IMPLEMENTED'
            'High-contrast ComboBox text: IMPLEMENTED'
            'Playback sources: audio / karaoke video / YouTube'
            'Phone camera: trusted HTTPS browser getUserMedia + WSS live preview'
            'Phone camera can connect before audio recording: IMPLEMENTED'
            'Desktop commands phone video start/stop with the take: IMPLEMENTED'
            'Live microphone/playback/REV-X/send gain updates during recording: IMPLEMENTED'
            'Audio export independent of video: WAV + MP3 320kbps'
            'Video export optional: MP4'
            'Export progress percentage / cancel / output-folder action: IMPLEMENTED'
            'MR816X real Wet Return fail-safe: IMPLEMENTED'
            'Hardware MR816X audio acceptance and real phone-browser acceptance: REQUIRES USER HARDWARE'
          ) | Set-Content dist/QA-REPORT-0.2.0.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Live-Studio-Preview-0.2.0-Windows
          path: klswork/dist/*
          if-no-files-found: error
          retention-days: 7
