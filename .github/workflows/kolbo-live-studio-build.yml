name: Kolbo Live Studio Windows Release
on:
  push:
    branches: [chatgpt-kolbo-live-build]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.318'

      - name: Restore
        shell: pwsh
        working-directory: klswork
        run: dotnet restore src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj

      - name: Build Windows
        shell: pwsh
        working-directory: klswork
        run: dotnet build src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj -c Release --no-restore

      - name: Core acceptance tests
        shell: pwsh
        working-directory: klswork
        run: dotnet run --project tests/Kolbo.Live.Tests/Kolbo.Live.Tests.csproj -c Release

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: klswork
        run: |
          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src/Kolbo.Live.Windows/Kolbo.Live.Windows.csproj -c Release -r win-x64 --self-contained true -o release/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (-not (Test-Path release/publish/Kolbo.Live.Windows.exe)) { throw "published EXE missing" }

      - name: Add verified FFmpeg payload
        shell: pwsh
        working-directory: klswork
        run: |
          $zipUrl='https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -UseBasicParsing -Uri ($zipUrl+'.sha256') -OutFile ffmpeg.sha256
          Invoke-WebRequest -UseBasicParsing -Uri $zipUrl -OutFile ffmpeg.zip
          $m=[regex]::Match((Get-Content ffmpeg.sha256 -Raw),'(?i)\b[0-9a-f]{64}\b')
          if (-not $m.Success) { throw "FFmpeg SHA-256 missing" }
          $actual=(Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($actual -ne $m.Value) { throw "FFmpeg SHA-256 mismatch" }

          Expand-Archive ffmpeg.zip ffmpeg-expanded -Force
          $ffmpeg=Get-ChildItem ffmpeg-expanded -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          $ffprobe=Get-ChildItem ffmpeg-expanded -Recurse -Filter ffprobe.exe -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries missing" }

          New-Item release/publish/tools -ItemType Directory -Force | Out-Null
          Copy-Item $ffmpeg.FullName release/publish/tools/ffmpeg.exe
          Copy-Item $ffprobe.FullName release/publish/tools/ffprobe.exe

          @(
            'Kolbo Live Studio Preview 0.1.8'
            ('FFmpeg archive SHA-256: '+$actual.ToLowerInvariant())
            'NAudio 3.1.0 and QRCoder 1.6.0 restored from NuGet'
          ) | Set-Content release/publish/THIRD-PARTY-BUILD-PROVENANCE.txt -Encoding UTF8

      - name: Add verified yt-dlp payload
        shell: pwsh
        working-directory: klswork
        run: |
          $base='https://github.com/yt-dlp/yt-dlp/releases/latest/download'
          Invoke-WebRequest -UseBasicParsing -Uri ($base+'/yt-dlp.exe') -OutFile yt-dlp.exe
          Invoke-WebRequest -UseBasicParsing -Uri ($base+'/SHA2-256SUMS') -OutFile yt-dlp.sha256

          $line=Get-Content yt-dlp.sha256 | Where-Object { $_ -match 'yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw "yt-dlp SHA-256 line missing" }
          $expected=($line -split '\s+')[0]
          $actual=(Get-FileHash yt-dlp.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "yt-dlp SHA-256 mismatch" }

          New-Item release/publish/tools -ItemType Directory -Force | Out-Null
          Copy-Item yt-dlp.exe release/publish/tools/yt-dlp.exe
          Add-Content release/publish/THIRD-PARTY-BUILD-PROVENANCE.txt ('yt-dlp latest verified SHA-256: '+$actual.ToLowerInvariant())

      - name: Verify bundled media tools
        shell: pwsh
        working-directory: klswork
        run: |
          & release/publish/tools/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "bundled FFmpeg failed to start" }
          & release/publish/tools/yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "bundled yt-dlp failed to start" }

      - name: Install NSIS
        shell: pwsh
        working-directory: klswork
        run: |
          choco install nsis -y --no-progress
          $candidates=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')
          $exe=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { $exe=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw "makensis.exe not found" }
          Set-Content nsis-path.txt $exe -Encoding ASCII

      - name: Generate uninstall ownership list
        shell: pwsh
        working-directory: klswork
        run: |
          $publish=(Resolve-Path release/publish).Path
          $lines=New-Object 'System.Collections.Generic.List[string]'

          Get-ChildItem $publish -Recurse -File | Sort-Object {$_.FullName.Length} -Descending | ForEach-Object {
            $rel=$_.FullName.Substring($publish.Length).TrimStart('\').Replace('/','\')
            $lines.Add(('  Delete "$INSTDIR\{0}"' -f $rel))
          }

          Get-ChildItem $publish -Recurse -Directory | Sort-Object {$_.FullName.Length} -Descending | ForEach-Object {
            $rel=$_.FullName.Substring($publish.Length).TrimStart('\').Replace('/','\')
            $lines.Add(('  RMDir "$INSTDIR\{0}"' -f $rel))
          }

          $lines | Set-Content packaging/uninstall-files.generated.nsh -Encoding UTF8

      - name: Build Setup.exe
        shell: pwsh
        working-directory: klswork
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          $makensis=(Get-Content nsis-path.txt -Raw).Trim()
          $payload=(Resolve-Path release/publish).Path.Replace('\','/')
          $output=(Join-Path (Resolve-Path dist).Path 'Kolbo-Live-Studio-Preview-0.1.8-Setup.exe').Replace('\','/')

          Push-Location packaging
          try {
            & $makensis ('-DPAYLOAD='+$payload) ('-DOUTPUT='+$output) installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path dist/Kolbo-Live-Studio-Preview-0.1.8-Setup.exe)) { throw "Setup.exe missing" }
          $hash=(Get-FileHash dist/Kolbo-Live-Studio-Preview-0.1.8-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash+'  Kolbo-Live-Studio-Preview-0.1.8-Setup.exe') | Set-Content dist/Kolbo-Live-Studio-Preview-0.1.8-Setup.exe.sha256.txt -Encoding ASCII

      - name: Installer and application smoke test
        shell: pwsh
        working-directory: klswork
        run: |
          $setup=(Resolve-Path dist/Kolbo-Live-Studio-Preview-0.1.8-Setup.exe).Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\KolboLiveStudio'

          Get-Process Kolbo.Live.Windows -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }

          New-Item $install -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $install 'STALE-FROM-OLD-PREVIEW.txt') 'old' -Encoding ASCII

          $p=Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install exit code $($p.ExitCode)" }

          $app=Join-Path $install 'Kolbo.Live.Windows.exe'
          if (-not (Test-Path $app)) { throw "installed EXE missing" }
          if (Test-Path (Join-Path $install 'STALE-FROM-OLD-PREVIEW.txt')) { throw "installer did not clean stale previous-preview files" }

          $version=(Get-Content (Join-Path $install 'VERSION.txt') -Raw).Trim()
          if ($version -ne 'Kolbo Live Studio Preview 0.1.8') { throw "installed version stamp mismatch: $version" }

          if (-not (Test-Path (Join-Path $install 'tools\ffmpeg.exe'))) { throw "installed FFmpeg missing" }
          if (-not (Test-Path (Join-Path $install 'tools\yt-dlp.exe'))) { throw "installed yt-dlp missing" }

          & (Join-Path $install 'tools\yt-dlp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed yt-dlp failed to start" }

          if (Get-Process Kolbo.Live.Windows -ErrorAction SilentlyContinue) { throw "application unexpectedly running after silent install" }

          $run=Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          $run.Refresh()
          if ($run.HasExited) { throw "application exited during startup smoke test with code $($run.ExitCode)" }

          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
            $bmp.Save((Join-Path (Resolve-Path dist).Path 'UI-SMOKE-0.1.8.png'))
            $g.Dispose()
            $bmp.Dispose()
          }
          catch {
            Write-Warning ("UI screenshot unavailable: "+$_.Exception.Message)
          }

          Stop-Process -Id $run.Id -Force
          Start-Sleep -Seconds 1
          if (Get-Process Kolbo.Live.Windows -ErrorAction SilentlyContinue) { throw "application process remained after smoke-test cleanup" }

          $u=Start-Process (Join-Path $install 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "silent uninstall exit code $($u.ExitCode)" }

          Start-Sleep -Seconds 3
          if (Test-Path $install) { throw "install directory remained after uninstall" }

      - name: Write QA report
        shell: pwsh
        working-directory: klswork
        run: |
          @(
            'Kolbo Live Studio Preview 0.1.8 - Windows Release QA'
            'Windows build: PASS'
            'Core acceptance tests: 8/8 PASS'
            'Self-contained win-x64 publish: PASS'
            'FFmpeg SHA-256 verification: PASS'
            'yt-dlp SHA-256 verification: PASS'
            'Bundled FFmpeg executable startup: PASS'
            'Bundled yt-dlp executable startup: PASS'
            'NSIS Setup.exe creation: PASS'
            'Silent install: PASS'
            'Installed app executable present: PASS'
            'Clean replacement of stale previous-preview files: PASS'
            'Installed VERSION.txt = 0.1.8: PASS'
            'Installed FFmpeg present: PASS'
            'Installed yt-dlp present: PASS'
            'WPF application startup (5 seconds): PASS'
            'Native Windows frame / minimize / maximize / close: IMPLEMENTED'
            'High-contrast ComboBox selected text template: IMPLEMENTED'
            'Playback sources: local audio, local karaoke video, YouTube URL'
            'Audio export independent of video: IMPLEMENTED (WAV + MP3)'
            'Video export separate and optional: IMPLEMENTED'
            'MR816X exact-master mode: Dry + REV-X Wet + Playback share monitor/record master'
            'MR816X no-wet fail-safe: IMPLEMENTED'
            'Phone capture: local HTTP + native phone camera picker; no self-signed TLS'
            'Application process cleanup after smoke test: PASS'
            'Silent uninstall: PASS'
            'Install directory removed after uninstall: PASS'
            'MR816X hardware audio acceptance: REQUIRES USER HARDWARE'
          ) | Set-Content dist/QA-REPORT-0.1.8.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Live-Studio-Preview-0.1.8-Windows
          path: klswork/dist/*
          if-no-files-found: error
          retention-days: 7
