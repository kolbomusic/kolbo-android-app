name: Kolbo v431 - ONE real LTX native video+audible audio (synthetic only)
on:
  push:
    branches: [kolbo-video-v431-native-av-zerogpu-20261011]
    paths: [".github/workflows/kolbo-v431-real-ltx-native-av.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kolbo-v431-one-ltx-zero-gpu
  cancel-in-progress: false
jobs:
  native_video_audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public Gradio API client and offline media QA
        run: |
          python -m pip install -q 'gradio_client>=2,<3' 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Make exactly ONE synthetic native LTX video-plus-audio attempt
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python .github/scripts/kolbo_ltx25_native_audio_real_proof_v431.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kolbo-v431-LTX-native-AI-video-audio-first-real-proof
          path: |
            v431-native-av-proof/native-ai-video-plus-audio-2s.mp4
            v431-native-av-proof/receipt.json
          retention-days: 7
          if-no-files-found: warn
