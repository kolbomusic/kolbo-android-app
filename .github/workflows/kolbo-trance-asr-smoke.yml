name: Kolbo Hebrew voice-to-story browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [kolbo-trance-studio-20261031]
    paths:
      - 'trance-studio/web/studio-asr-worker.js'
      - 'trance-studio/tests/browser_asr_smoke.cjs'
      - '.github/workflows/kolbo-trance-asr-smoke.yml'
jobs:
  asr-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium, TTS and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          npm install --no-save playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Synthesize a local Hebrew voice fixture
        run: |
          espeak-ng -v he -s 130 -w /tmp/kolbo-hebrew-asr.wav 'שלום, אני נוסע היום לעבודה. אחרי העבודה הלכתי לים.'
          ffmpeg -hide_banner -loglevel error -y -i /tmp/kolbo-hebrew-asr.wav -ac 1 -ar 16000 -f f32le /tmp/kolbo-hebrew-asr.f32
          test -s /tmp/kolbo-hebrew-asr.f32
      - name: Run quantized Whisper in actual Chromium worker
        run: |
          python -m http.server 8765 -d trance-studio/web >/tmp/kolbo-http.log 2>&1 &
          node trance-studio/tests/browser_asr_smoke.cjs
