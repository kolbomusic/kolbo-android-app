name: Kolbo Cloudflare access preflight
on:
  push:
    branches: [kolbo-video-v520-lightweight-cloud-first-20261014]
    paths: [.github/workflows/kolbo-cloudflare-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether one-time owner account connection is already present
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" = "true" ] && [ "$HAVE_ACCOUNT" = "true" ]; then
            echo "CLOUDFLARE_CONNECTION=READY"
          else
            echo "CLOUDFLARE_CONNECTION=NOT_CONFIGURED"
            echo "No deployment or API call attempted; a one-time owner account connection is required."
          fi
      - name: Confirm publishing stays disabled without live model proof
        run: |
          python3 - <<'PY'
          import json
          with open('cloud-brain-worker/endpoint.json',encoding='utf8') as f:
              d=json.load(f)
          print('ENDPOINT_ENABLED='+str(bool(d.get('enabled'))).lower())
          print('NO_CHANGE_TO_LIVE_TRAFFIC=true')
          PY
