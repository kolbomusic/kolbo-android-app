name: Kolbo Grid 3.3 source audit (no Android build)
on:
  push:
    branches: [kolbo-grid-v33-live-catalog-android-20261010]
    paths: [.github/workflows/kolbo-v33-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract last tested native app source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zipfile,hashlib
          b=base64.b64decode(Path('kolbo-grid-v27-android.src.b64').read_text().strip(),validate=True)
          print('SHA256',hashlib.sha256(b).hexdigest())
          p=Path('source-v27.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for item in z.infolist():
              assert not item.filename.startswith('/') and '..' not in Path(item.filename).parts
            z.extractall('source-v27')
            print('SOURCE_FILES',[(i.filename,i.file_size) for i in z.infolist()])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-V27-Android-Source-Audit
          path: source-v27/
          retention-days: 3
