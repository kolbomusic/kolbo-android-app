name: Kolbo Video Studio 1.2.0 Hebrew Audio Preview APK Build
on:
  push:
    branches: [video-studio-apk-1.2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          echo '5399db114c99476bcd3ae4273fe2049254c85d5c5f97c816486d46df48d36366  videostudio-ci/source-1.2.0.zip' | sha256sum -c -
          rm -rf project && mkdir project
          unzip -q videostudio-ci/source-1.2.0.zip -d project
          mkdir -p project/app/src/main/assets
      - name: Structural gates
        shell: bash
        run: |
          cd project
          python3 tests/static_check.py
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python3 tools/build.py
          test -s build/final/Kolbo-Video-Studio-1.2.0.apk
          test -s build/release/unsigned.apk
      - name: Java and package verification
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python3 tools/verify.py
      - name: Build Android test package
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python3 tools/build.py --test
          test -s build/test/Kolbo-Video-Studio-tests.apk
      - name: Live Hebrew translation gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          q='הדמות נכנסת לשירותים ואז מתיישבת על האסלה'
          url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=he&tl=en&dt=t&q='+urllib.parse.quote(q)
          req=urllib.request.Request(url,headers={'User-Agent':'Kolbo-Video-Studio/1.2.0'})
          with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
          text=' '.join(x[0] for x in j[0] if x and x[0]).lower()
          print('TRANSLATION',text)
          assert ('bathroom' in text or 'restroom' in text or 'toilet' in text) and ('sit' in text)
          print('HEBREW_TRANSLATION_PASS=YES')
          PY
      - name: Live provider contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          checks=[
            ('https://lightricks-ltx-video-distilled.hf.space','/image_to_video'),
            ('https://lightricks-ltx-video-distilled.hf.space','/text_to_video'),
            ('https://kulkas2pintu-qwen-edit-image.hf.space','/edit'),
            ('https://zerogpu-aoti-wan2-2-fp8da-aoti-faster.hf.space','/generate_video'),
            ('https://hkchengrex-mmaudio.hf.space','/video_to_audio')
          ]
          for base,endpoint in checks:
              req=urllib.request.Request(base+'/gradio_api/info',headers={'User-Agent':'Kolbo-Video-Studio/1.2.0'})
              with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
              assert endpoint in j.get('named_endpoints',{}),(base,endpoint)
              print('LIVE_CONTRACT_PASS',base,endpoint)
          PY
      - name: Real MMAudio audio-track gate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://huggingface.co/hkchengrex/MMAudio/resolve/main/examples/sora_beach.mp4 -o /tmp/mma-input.mp4
          python3 - <<'PY'
          import json,urllib.request,uuid,re
          base='https://hkchengrex-mmaudio.hf.space';ua='Kolbo-Video-Studio/1.2.0'
          raw=open('/tmp/mma-input.mp4','rb').read();b='Kolbo'+uuid.uuid4().hex
          body=(('--'+b+'\r\nContent-Disposition: form-data; name="files"; filename="input.mp4"\r\nContent-Type: video/mp4\r\n\r\n').encode()+raw+('\r\n--'+b+'--\r\n').encode())
          req=urllib.request.Request(base+'/gradio_api/upload',data=body,method='POST',headers={'Content-Type':'multipart/form-data; boundary='+b,'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=40) as r:path=json.loads(r.read().decode())[0]
          video={'path':path,'orig_name':'input.mp4','mime_type':'video/mp4','meta':{'_type':'gradio.FileData'}}
          payload={'data':[video,'ocean waves and distant seagulls, natural synchronized beach ambience','music, speech, narration, singing',0,20,4.5,3.0]}
          req=urllib.request.Request(base+'/gradio_api/call/video_to_audio',data=json.dumps(payload).encode(),method='POST',headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':ua})
          with urllib.request.urlopen(req,timeout=40) as r:event=json.loads(r.read().decode())['event_id']
          req=urllib.request.Request(base+'/gradio_api/call/video_to_audio/'+event,headers={'Accept':'text/event-stream','User-Agent':ua})
          with urllib.request.urlopen(req,timeout=600) as r:s=r.read().decode('utf-8','replace')
          ev='';parts=[];complete=None
          for line in s.splitlines()+['']:
              if not line:
                  if ev=='complete':complete='\n'.join(parts)
                  if ev=='error':raise RuntimeError('MMAudio provider error: '+'\n'.join(parts))
                  ev='';parts=[];continue
              if line.startswith('event:'):ev=line[6:].strip()
              elif line.startswith('data:'):parts.append(line[5:].strip())
          assert complete
          obj=json.loads(complete)
          def find(o):
              if isinstance(o,dict):
                  u=o.get('url')
                  if isinstance(u,str) and u.startswith(base+'/'):return u
                  for v in o.values():
                      z=find(v)
                      if z:return z
              elif isinstance(o,list):
                  for v in o:
                      z=find(v)
                      if z:return z
          url=find(obj);assert url
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=90) as r:data=r.read(25*1024*1024)
          assert len(data)>1000 and data[4:8]==b'ftyp'
          assert b'soun' in data, 'MP4 does not expose an audio handler'
          print('MMAUDIO_MP4_WITH_AUDIO_PASS=YES',len(data))
          PY
      - name: Checksums
        shell: bash
        run: |
          cd project
          sha256sum build/final/Kolbo-Video-Studio-1.2.0.apk build/release/unsigned.apk build/test/Kolbo-Video-Studio-tests.apk
      - name: Upload build for original-key signing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-Studio-1.2.0-build
          if-no-files-found: warn
          retention-days: 2
          path: |
            project/build/final/Kolbo-Video-Studio-1.2.0.apk
            project/build/release/unsigned.apk
            project/build/test/Kolbo-Video-Studio-tests.apk
            project/build/verification/**
            project/toolchain/apksig.jar
            project/tools/SignApk.java
            project/tools/VerifyApk.java
