name: Kolbo Trance Studio audio regression
on:
  pull_request:
    branches:
      - kolbo-trance-studio-20261031
    paths:
      - 'trance-studio/**'
      - '.github/workflows/kolbo-trance-tests.yml'
  push:
    branches:
      - kolbo-trance-studio-20261031
      - kolbo-trance-asr-warm-cache-20261101
      - kolbo-trance-story-recovery-20261101
      - kolbo-trance-mobile-ai-quota-fallback-20261101
      - kolbo-trance-fix-ai-ui-regression-20261101
      - kolbo-trance-manual-create-precise-scenes-20261101
      - kolbo-trance-audio-coherence-20261101
      - kolbo-trance-release-audio-242-20261101
      - kolbo-trance-restart-recovery-20261101
      - kolbo-trance-provider-failure-diagnostics-20261101
      - kolbo-trance-share-no-reload-244-20261102
      - kolbo-trance-creative-audio-20261102
      - kolbo-trance-static-entry-20261102
      - kolbo-trance-link-share-245-20261102
    paths:
      - 'trance-studio/**'
      - '.github/workflows/kolbo-trance-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r trance-studio/backend/requirements.txt
      - name: Compile
        run: python -m compileall -q trance-studio/backend trance-studio/tests
      - name: Validate no-sleep static gateway
        run: node trance-studio/tests/test_static_entry.js
      - name: Validate frontend JavaScript
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('trance-studio/web/studio.html','utf8');const a=s.indexOf('<script>');const b=s.lastIndexOf('</script>');if(a<0||b<a)throw Error('No browser JS found');new Function(s.slice(a+8,b));"
      - name: Check local Hebrew ASR worker syntax
        run: |
          node --check trance-studio/web/studio-asr-worker.js
          python - <<'PY'
          from pathlib import Path
          s=Path('trance-studio/web/studio.html').read_text(encoding='utf-8')
          assert "recognizeBeforeVideo" in s and "transcript_origin" in s
          assert "studio-asr-worker.js" in s
          assert "recognitionFallback" not in s and "transcriptDetails" not in s
          assert "form.set('make_video',wantsVideo?'on':'off')" in s
          assert "verifyTranscript(recognized)?recognized" in s
          assert 'id="ai_video_consent"' in s
          assert "form.set('ai_video_consent'" in s
          assert 'completeAIVideoOnPhone' in s and 'readGradioCompletion' in s
          assert "שירות AI ציבורי" in s
          worker=Path('trance-studio/web/studio-asr-worker.js').read_text(encoding='utf-8')
          assert "onnx-community/whisper-tiny" in worker
          assert "itayinbar/whisper-he-12x2" not in worker
          assert "language:'hebrew'" in worker
          assert "dtype:'q8'" in worker
          PY
      - name: Verify PWA manifest and share target
        run: |
          python -c "import json,pathlib;d=json.loads(pathlib.Path('trance-studio/web/studio.webmanifest').read_text());assert d['share_target']['method']=='POST';assert d['share_target']['params']['files'][0]['name']=='audio'"
      - name: Confirm WhatsApp sharing never auto-runs anything
        run: |
          node trance-studio/tests/test_manual_share.js
          node trance-studio/tests/test_native_share_resume.js
          node trance-studio/tests/test_social_link_share.js
      - name: Verify limited Render restart recovery without automated WhatsApp creation
        run: node trance-studio/tests/test_restart_recovery.js
      - name: Validate licensed music and story-only YouTube UI
        run: node trance-studio/tests/test_video_music_ui.js
      - name: Verify Android and PWA direct WhatsApp video share limits
        run: node trance-studio/tests/test_pwa_video_share.js
      - name: Verify free AI phone retry keeps MP4 without regenerating
        run: node trance-studio/tests/test_ai_phone_retry.js
      - name: Verify public AI video errors are safe and actionable
        run: node trance-studio/tests/test_provider_diagnostics.js
      - name: Run audio and API tests
        run: python -m unittest discover -s trance-studio/tests -v
