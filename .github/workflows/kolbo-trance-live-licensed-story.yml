name: Kolbo REAL licensed song and independent story production proof
on:
  push:
    branches: [kolbo-trance-studio-20261031]
    paths:
      - '.github/workflows/kolbo-trance-live-licensed-story.yml'
      - 'trance-studio/tests/live_licensed_music_story_modes.py'
  workflow_dispatch:
jobs:
  live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic test media — no copyrighted tracks or personal data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -nostdin -v error -y \
            -f lavfi -i 'testsrc2=size=360x640:rate=12:duration=4' \
            -f lavfi -i 'sine=frequency=230:sample_rate=32000:duration=4' \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast \
            -pix_fmt yuv420p -c:a aac -b:a 96k \
            -shortest /tmp/kolbo-rights-test-video.mp4
          ffmpeg -nostdin -v error -y -f lavfi \
            -i 'sine=frequency=440:sample_rate=32000:duration=3' \
            -c:a libmp3lame -q:a 4 /tmp/kolbo-rights-test-music.mp3
          test -s /tmp/kolbo-rights-test-video.mp4
          test -s /tmp/kolbo-rights-test-music.mp3
      - name: PROVE live mix contains user-supplied song and new story never reuses source
        run: python trance-studio/tests/live_licensed_music_story_modes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kolbo-Licensed-Music-Actual-Video-Proof
          path: |
            /tmp/kolbo-licensed-production-proof.mp3
            /tmp/kolbo-licensed-production-proof.mp4
          if-no-files-found: ignore
          retention-days: 7
