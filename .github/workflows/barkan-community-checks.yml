name: Barkan community safety checks
on:
  push:
    branches:
      - karnafim-barkan-rebuild-20261102
    paths:
      - "karnafim-next/**"
      - ".github/workflows/barkan-community-checks.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: karnafim-next
    env:
      DATABASE_URL: ""
      BARKAN_PUBLIC_AUTH: "0"
      BARKAN_SAFETY_RELEASE_APPROVED: "0"
      BARKAN_ALLOW_SIGNUP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: karnafim-next/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py review_rules.py tests/
      - name: Verify public navigation and security
        run: python tests/test_design_quality.py
      - name: Verify moderation triage
        run: python tests/test_review_rules.py
      - name: Verify private media access
        run: python tests/test_media_permissions.py
