name: Kolbo live free AI-generated original Hebrew story video
on:
  push:
    branches: [kolbo-trance-studio-20261031]
    paths:
      - 'trance-studio/tests/live_generated_video_smoke.py'
      - 'trance-studio/backend/ai_video.py'
      - '.github/workflows/kolbo-trance-live-generated.yml'
  workflow_dispatch:
jobs:
  production-hebrew-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare only an invented Hebrew sample recording
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'gTTS==2.5.4'
          python - <<'PY'
          from gtts import gTTS
          text='איש זורק כוס זכוכית על הרצפה. הכוס נשברת לרסיסים.'
          gTTS(text,lang='iw',slow=False).save('/tmp/kolbo-ai-hebrew.mp3')
          PY
          ffmpeg -nostdin -loglevel error -y -i /tmp/kolbo-ai-hebrew.mp3 -c:a libopus -b:a 24k -ar 48000 -ac 1 /tmp/kolbo-ai-original-hebrew.opus
      - name: Verify the live Render server has the newly deployed AI mode
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://kolbo-trance-studio.onrender.com/studio'
          for attempt in range(65):
            try:
              with urllib.request.urlopen(url,timeout=20) as response:
                page=response.read().decode('utf-8')
              if 'id="ai_video_consent"' in page:
                print('REAL_SERVER_AI_MODE_DEPLOYED',flush=True)
                break
            except Exception as exc:
              print('REAL_SERVER_NOT_READY',type(exc).__name__,flush=True)
            time.sleep(5)
          else:
            raise RuntimeError('New AI-video screen not yet deployed to Render')
          PY
      - name: Require an actual free AI-created motion MP4 from the LIVE Render server
        run: python trance-studio/tests/live_generated_video_smoke.py
