name: Kolbo Trance real free AI video availability proof
# Live requests use a shared public ZeroGPU quota. Never kick off a swarm
# of 30-second AI generation proofs on an ordinary source-code push.
on:
  workflow_dispatch:
concurrency:
  group: kolbo-trance-render-acceptance
  cancel-in-progress: false
jobs:
  ai-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Produce a real public AI moving shot from a synthetic prompt
        run: python trance-studio/tests/production_ai_provider_canary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kolbo-Public-AI-Moving-Video-Canary
          path: /tmp/kolbo-public-video-canary.mp4
          if-no-files-found: ignore
          retention-days: 5
