name: Public Facebook video link fallback safety
on:
  push:
    branches:
      - kolbo-trance-facebook-public-fallback-20261102
      - kolbo-trance-facebook-html-canonical-20261102
      - kolbo-trance-facebook-import-diagnostics-20261102
      - kolbo-trance-facebook-public-media-observability-20261102
      - kolbo-trance-studio-20261031
    paths:
      - 'trance-studio/backend/link_import.py'
      - 'trance-studio/tests/test_public_facebook_import_fallback.py'
      - 'trance-studio/tests/test_public_facebook_html_metadata.py'
      - 'trance-studio/tests/test_public_facebook_browser_retry.py'
      - 'trance-studio/tests/test_public_facebook_metadata_stream.py'
      - 'trance-studio/backend/requirements.txt'
      - 'trance-studio/web/studio.html'
      - 'trance-studio/backend/app.py'
      - 'trance-studio/tests/test_simple_mobile_ui.js'
      - '.github/workflows/kolbo-trance-public-link-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-fallback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile importer and run safe public-link tests
        run: |
          python -m py_compile trance-studio/backend/link_import.py
          python -m unittest discover -s trance-studio/tests -p 'test_public_facebook_*.py' -v
          grep -q -- '--no-playlist' trance-studio/backend/link_import.py
          grep -q -- '--max-filesize' trance-studio/backend/link_import.py
          grep -q -- 'No raw URL' trance-studio/backend/link_import.py
          node trance-studio/tests/test_social_link_share.js
          node trance-studio/tests/test_simple_mobile_ui.js
      - name: Verify free browser impersonation dependency is installable
        run: |
          python -m pip install --disable-pip-version-check 'yt-dlp[curl-cffi]==2026.10.26'
          python -m yt_dlp --list-impersonate-targets | tee /tmp/kolbo-impersonate-targets.txt
          grep -i 'chrome' /tmp/kolbo-impersonate-targets.txt
          grep -q '99' /tmp/kolbo-impersonate-targets.txt
