name: Kolbo Sing Studio 0.18.1 Android CI
on:
  push:
    branches: [singstudio-test-0.18.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android debug APK and verification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive and extract
        shell: bash
        run: |
          echo "add113e31ad74d034f0fd8de7317e25f82aa44cb0b9740c351be90e09874a527  singstudio-ci/source-0.18.1.zip" | sha256sum -c -
          unzip -t singstudio-ci/source-0.18.1.zip | tail -2
          mkdir -p project
          unzip -q singstudio-ci/source-0.18.1.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile native and Android APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -2
          sha256sum "$APK" | tee project/apk-sha256.txt
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: KolboSingStudio-0.18.1-debug-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/apk-sha256.txt
          if-no-files-found: error
      - name: Unit tests
        working-directory: project
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Lint
        working-directory: project
        run: gradle :app:lintDebug --no-daemon --stacktrace
