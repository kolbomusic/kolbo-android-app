name: Kolbo Sing Studio 0.19.0 Source Extract
on:
  push:
    branches: [singstudio-test-0.19.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract 0.18.1 source
        shell: bash
        run: |
          echo "add113e31ad74d034f0fd8de7317e25f82aa44cb0b9740c351be90e09874a527  singstudio-ci/source-0.18.1.zip" | sha256sum -c -
          rm -rf project && mkdir project
          unzip -q singstudio-ci/source-0.18.1.zip -d project
          find project -type f | sort > project/source-files.txt
      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: KolboSingStudio-0.18.1-extracted-source
          path: project
          if-no-files-found: error
