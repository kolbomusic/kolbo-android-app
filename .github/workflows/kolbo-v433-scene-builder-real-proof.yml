name: Kolbo v433 - ONE real two-person stage scene builder proof (synthetic)
on:
  push:
    branches: [kolbo-video-v433-scene-compliance-gates-20261011]
    paths: ['.github/workflows/kolbo-v433-scene-builder-real-proof.yml']
permissions:
  contents: read
concurrency:
  group: kolbo-v433-one-flux-scene-trial
  cancel-in-progress: false
jobs:
  flux_scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'gradio_client>=2,<3' 'Pillow>=10,<13'
      - name: ONE public Free ZeroGPU scene integration inference without user photos
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python .github/scripts/kolbo_v433_real_scene_builder_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kolbo-v433-real-FLUX-two-person-unified-stage-image
          path: |
            scene-stage-v433/two-illustrated-actors-reference.png
            scene-stage-v433/generated-shared-stage-preview.png
            scene-stage-v433/receipt.json
          retention-days: 7
          if-no-files-found: warn
