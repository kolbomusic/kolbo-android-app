name: Kol Yaakov Android 15 Install Smoke

on:
  push:
    branches:
      - build/kol-yaakov-native-android-v0.4.2
    paths:
      - '.github/workflows/kol-yaakov-android15-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build from native source
        working-directory: kol-yaakov-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Android 15 install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: kol-yaakov-native
          script: |
            set -eu
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.ofirgilboa.kolyaakov
            adb shell am start -W -n com.ofirgilboa.kolyaakov/.MainActivity > /tmp/launch.txt
            cat /tmp/launch.txt
            grep -Eq 'Status: ok|Complete' /tmp/launch.txt
            sleep 2
            test -n "$(adb shell pidof com.ofirgilboa.kolyaakov | tr -d '\r')"
            adb shell dumpsys package com.ofirgilboa.kolyaakov > /tmp/pkg.txt
            grep -q 'android.permission.VIBRATE' /tmp/pkg.txt
            ! grep -q 'android.permission.INTERNET' /tmp/pkg.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -q 'קול יעקב' /tmp/window.xml
            echo ANDROID_15_INSTALL_LAUNCH_PASS
