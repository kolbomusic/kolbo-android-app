name: Build Video Studio 1.2.1 Router
on:
  push:
    branches: [video-studio-apk-1.2.1-router]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source
        run: echo '7802b27bee98047fbbca3a2ee323592df26dc45f43ce9d0e3a645fb33d6d54d8  videostudio-ci/source-1.2.1.zip' | sha256sum -c -
      - name: Extract
        run: |
          rm -rf project
          mkdir project
          unzip -q videostudio-ci/source-1.2.1.zip -d project
          mkdir -p project/app/src/main/assets
      - name: Build and verify
        run: |
          cd project
          python3 tests/static_check.py
          python3 tools/build.py
          python3 tools/verify.py
          python3 tools/build.py --test
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-Studio-1.2.1-router-build
          retention-days: 2
          path: |
            project/build/final/Kolbo-Video-Studio-1.2.1.apk
            project/build/release/unsigned.apk
            project/build/test/Kolbo-Video-Studio-tests.apk
            project/toolchain/apksig.jar
            project/tools/SignApk.java
            project/tools/VerifyApk.java
