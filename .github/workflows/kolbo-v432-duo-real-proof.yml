name: Kolbo v432 - real two-character input accepted by public LTX
on:
  push:
    branches: [kolbo-video-v432-two-photo-button-fix-20261011]
    paths: ['.github/workflows/kolbo-v432-duo-real-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kolbo-v432-one-duo-public-zero-gpu
  cancel-in-progress: false
jobs:
  real_merged_duo_trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public client and media validators
        run: |
          python -m pip install -q 'gradio_client>=2,<3' 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: SINGLE real public GPU image-to-video AV test, two synthetic portraits
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python .github/scripts/kolbo_v432_duo_synthetic_real_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kolbo-v432-LTX-two-person-combined-reference-real-motion-sound
          path: |
            v432-duo-synthetic-proof/two-different-illustrated-people.jpg
            v432-duo-synthetic-proof/two-illustrated-characters-LTX-AI-with-audio.mp4
            v432-duo-synthetic-proof/receipt.json
          if-no-files-found: warn
          retention-days: 7
