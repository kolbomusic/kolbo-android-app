name: Validate Wikimedia licensed live footage availability
on:
  workflow_dispatch:
  push:
    branches: [kolbo-trance-studio-20261031]
    paths:
      - 'trance-studio/backend/live_video.py'
      - '.github/workflows/kolbo-footage-smoke.yml'
jobs:
  real-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg real public video and music smoke
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import sys,tempfile,pathlib,json,subprocess
          sys.path.insert(0,'trance-studio/backend')
          from live_video import visual_plan,export_live_story,commons_candidates
          plan=visual_plan('כולם רוקדים במסיבה.',3.)
          with tempfile.TemporaryDirectory() as tmp:
            root=pathlib.Path(tmp)
            audio=root/'music.mp3';output=root/'motion.mp4'
            subprocess.run(['ffmpeg','-loglevel','error','-y','-f','lavfi','-i',
                            'sine=frequency=350:duration=3','-codec:a','libmp3lame',
                            str(audio)],check=True)
            matches=commons_candidates('people dancing')
            if matches:
              print('REAL_VIDEO_MATCHES',[(m['title'],m['license']) for m in matches[:3]])
              sources=export_live_story(audio,output,plan,root/'assets')
              streams=json.loads(subprocess.check_output([
                'ffprobe','-loglevel','error','-show_streams','-of','json',str(output)]))
              assert set(s['codec_type'] for s in streams['streams'])=={'audio','video'}
              print('AUTHENTIC_MP4_PASSED',output.stat().st_size,sources)
            else:
              raise SystemExit('No licensed footage found for real end-to-end case')
          PY
      - name: Exercise no-key Wikimedia Commons video search
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'trance-studio/backend')
          from live_video import commons_candidates
          phrases=('car driving','donkey braying','people dancing','rain falling')
          available={}
          for q in phrases:
            try:
              found=commons_candidates(q)
              available[q]=len(found)
              print('MEDIA_QUERY',q,'candidates',len(found),
                    'sample',[(x['title'],x['license']) for x in found[:2]])
            except Exception as exc:
              available[q]=repr(exc)
              print('MEDIA_ERROR',q,repr(exc))
          print('FOOTAGE_AVAILABILITY',json.dumps(available))
          if not any(isinstance(v,int) and v>0 for v in available.values()):
            raise SystemExit('No verifiable public motion footage found; cannot ship a live video promise')
          PY
