name: Kolbo Video 4.7.4 dual public GPU engine Android build
on:
  push:
    branches: [kolbo-video-v474-smart-gpu-failover-20261014]
    paths:
      - mobile-kolbo/**
      - .github/workflows/kolbo-v474-dual-gpu-apk.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Offline Hebrew scene, provider failure and two-engine route tests
        run: |
          mkdir -p /tmp/kolbo-tests
          javac -encoding UTF-8 -d /tmp/kolbo-tests \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/WanProviderCatalog.java \
            mobile-kolbo/test/WanProviderCatalogTest.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/HebrewIntentBrain.java \
            mobile-kolbo/test/HebrewIntentBrainTest.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/ProviderErrorClassifier.java \
            mobile-kolbo/test/ProviderErrorClassifierTest.java
          java -cp /tmp/kolbo-tests com.kolbomusic.video.WanProviderCatalogTest
          java -cp /tmp/kolbo-tests com.kolbomusic.video.HebrewIntentBrainTest
          java -cp /tmp/kolbo-tests com.kolbomusic.video.ProviderErrorClassifierTest
      - name: Verify immutable hosts and per-engine contract binding
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("mobile-kolbo/app/src/main/java/com/kolbomusic/video")
          client=(root/"WanNativeClient.java").read_text()
          ui=(root/"MainActivity.java").read_text()
          cat=(root/"WanProviderCatalog.java").read_text()
          for needle in ("WanProviderCatalog.order(lastFailed,complexScene)",
            "selectForNewJob(lastFailed,scene.complex,progress)",
            "engine.parameters[i]","engine.isLightning()",
            "args.put(JSONObject.NULL)",'args.put("UniPCMultistep")',
            "useForExistingJob(selectedProvider)",
            "engine.host.equalsIgnoreCase(input.getHost())"):
            assert needle in client,needle
          for needle in ("providerSelected(String providerId,String providerName)",
            'putString("last_provider",providerId)',
            'getString("last_provider","fast")',
            '"last_failed"', "FinalProviderRejection"):
            assert needle in ui,needle
          assert "WebView" not in ui
          assert "https://" in cat
          assert "versionName '4.7.4'" in Path("mobile-kolbo/app/build.gradle").read_text()
          print("PASS: no automatic GPU resubmit, HTTPS host pin, tracked provider recovery")
          PY
      - name: Provision Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build signed debug APK
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Verify package manifest signature and hash
        run: |
          APK=mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v4.7.4-Dual-Wan-SmartGPU-APK
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
