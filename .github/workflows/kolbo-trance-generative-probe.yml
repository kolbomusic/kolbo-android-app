name: Probe free public text-to-video generation API
on:
  push:
    branches: [kolbo-trance-generative-scenes-20261101]
    paths: ['.github/workflows/kolbo-trance-generative-probe.yml']
  workflow_dispatch:
jobs:
  inspect-public-space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect free LTX Space API without spending GPU credits
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          sites=[
            'https://lightricks-ltx-2-5.hf.space/gradio_api/openapi.json',
            'https://lightricks-ltx-2-5.hf.space/config'
          ]
          for u in sites:
            try:
              request=urllib.request.Request(u,headers={'User-Agent':'KolboTranceStudio/2.3'})
              with urllib.request.urlopen(request,timeout=24) as res:
                data=res.read(1200000)
                doc=json.loads(data)
                print('LTX_PUBLIC_STATUS',res.status,'url=',u,'keys=',list(doc)[:20],flush=True)
                if 'openapi' in u:
                  for path,v in doc.get('paths',{}).items():
                    if 'run' in path or 'predict' in path or 'generate' in path:
                      print('LTX_PUBLIC_API_PATH',path,'POST?',bool(v.get('post')),'details',json.dumps(v.get('post',{}).get('requestBody',{}),ensure_ascii=False)[:800],flush=True)
                else:
                  print('LTX_DEPENDENCIES',[(d.get('api_name'),d.get('inputs'),d.get('outputs')) for d in doc.get('dependencies',[]) if d.get('api_name')][:8],flush=True)
            except Exception as e:
              print('LTX_PUBLIC_FAILED',type(e).__name__,str(e)[:350],flush=True)
          PY
      - name: Try 1-second fictional text-to-video clip with anonymous public quota
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,time
          base='https://lightricks-ltx-2-5.hf.space'
          data={'data':['A cheerful brown donkey opens its mouth and brays on a sunny farm, cinematic live-action video, continuous motion, no text.',None,768,512,1.0,42,'conv',False,False,False]}
          try:
            req=urllib.request.Request(base+'/gradio_api/call/v2/run',
              data=json.dumps(data).encode(),headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=35) as response:
              event=json.load(response)
            print('LTX_GENERATION_SUBMITTED',str(event)[:200],flush=True)
            event_id=event['event_id']
            with urllib.request.urlopen(base+'/gradio_api/call/run/'+event_id,timeout=210) as response:
              for raw in response:
                line=raw.decode('utf-8','replace').strip()
                if line.startswith('event:'):print('LTX_EVENT',line,flush=True)
                if line.startswith('data:'):
                  print('LTX_RESULT',line[:800],flush=True)
                  if 'video' in line or '"url"' in line or 'error' in line:
                    break
          except Exception as error:
            print('LTX_GENERATION_UNAVAILABLE',type(error).__name__,str(error)[:700],flush=True)
          PY
      - name: Try alternative LTX public distilled AI video space without an API key
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base='https://lightricks-ltx-video-distilled.hf.space'
          data={'data':[
            'A cheerful donkey brays on a sunny farm, cinematic live-action action, no words on screen.',
            'low quality, blurry, text', '', '',704,512,'text-to-video',2.0,9,42,True,1.0,True]}
          try:
            req=urllib.request.Request(base+'/gradio_api/call/text_to_video',
              data=json.dumps(data).encode(),headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=35) as response:
              event=json.load(response)
            print('LTX_DISTILLED_SUBMITTED',str(event)[:250],flush=True)
            with urllib.request.urlopen(base+'/gradio_api/call/text_to_video/'+event['event_id'],timeout=220) as response:
              ev=''
              for raw in response:
                line=raw.decode('utf-8','replace').strip()
                if line.startswith('event:'):ev=line[6:].strip()
                if line.startswith('data:') and ev in ('complete','error'):
                  print('LTX_DISTILLED_RESULT',ev,line[:900],flush=True)
                  break
          except Exception as error:
            print('LTX_DISTILLED_UNAVAILABLE',type(error).__name__,str(error)[:700],flush=True)
          PY
