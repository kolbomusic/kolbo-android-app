name: Build Kolbo Trance Studio Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - kolbo-trance-studio-20261031
      - kolbo-trance-android-v22-20261101
    paths:
      - 'trance-studio/android/**'
      - 'trance-studio/web/studio.html'
      - 'trance-studio/backend/live_video.py'
      - 'trance-studio/tests/test_live_video.py'
      - '.github/workflows/kolbo-trance-android.yml'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "$ANDROID_HOME/cmdline-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up supported Python for audio/video regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg for audio and MP4 acceptance tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install and run server plus animation acceptance tests
        run: |
          python -m pip install -r trance-studio/backend/requirements.txt
          python -m unittest discover -s trance-studio/tests -v
      - name: Verify new Android user experience and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trance-studio/web/studio.html').read_text()
          assert 'id="nativeStatus"' in p and 'id="stages"' in p
          assert 'kolboImportSharedAudio' in p and 'if(!active&&files.length)setTimeout' in p
          src=p.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/trance22.js').write_text(src)
          PY
          node --check /tmp/trance22.js
      - name: Build installable Android APK
        run: gradle --no-daemon --stacktrace -p trance-studio/android :app:assembleDebug
      - name: Verify APK and prepare distribution
        run: |
          set -eux
          mkdir -p dist
          cp trance-studio/android/app/build/outputs/apk/debug/app-debug.apk dist/Kolbo-Trance-Story-v2.2.0-beta.apk
          test -s dist/Kolbo-Trance-Story-v2.2.0-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Kolbo-Trance-Story-v2.2.0-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Story-v2.2.0-beta.apk | head -n 8
          sha256sum dist/Kolbo-Trance-Story-v2.2.0-beta.apk | tee dist/SHA256SUMS.txt
      - name: Confirm independent Android package and media bridge
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Story-v2.2.0-beta.apk | grep -q "package: name='com.kolbomusic.trancestudio.story22'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Story-v2.2.0-beta.apk | grep -q "versionCode='22' versionName='2.2.0-beta'"
          grep -q 'offlinePanel' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'downloadVideo' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'shareVideo' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
      - name: Archive installation APK
        uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Trance-Story-2.2-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as a GitHub pre-release
        if: github.ref == 'refs/heads/kolbo-trance-studio-20261031'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="trance-story-v2.2.0-beta.1"
          APK="dist/Kolbo-Trance-Story-v2.2.0-beta.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Kolbo Trance Story v2.2.0 beta · Android APK" \
              --notes "Version 2.2: improved Hebrew RTL mobile UI, direct WhatsApp one-click remix and MP4 request, four step progress, offline-retry Android screen, improved original-file Hebrew recognition with pinned PyAV and real licensed footage matching. No transcripts are shown. Some stories may have no suitable matching video. Requires internet. Beta APK signed with GitHub Actions debug key." \
              --prerelease
          fi
