name: Build Kolbo Trance Studio Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - kolbo-trance-studio-20261031
      - kolbo-trance-android-v22-20261101
      - kolbo-trance-manual-create-precise-scenes-20261101
      - kolbo-trance-audio-coherence-20261101
      - kolbo-trance-release-audio-242-20261101
      - kolbo-trance-native-startup-recovery-20261102
      - kolbo-trance-share-no-reload-244-20261102
      - kolbo-trance-link-share-246-20261102
      - kolbo-trance-clean-simple-social-ui-20261102
    paths:
      - 'trance-studio/android/**'
      - 'trance-studio/web/studio.html'
      - 'trance-studio/backend/live_video.py'
      - 'trance-studio/backend/ai_video.py'
      - 'trance-studio/backend/narrative_plan.py'
      - 'trance-studio/backend/motion_quality.py'
      - 'trance-studio/tests/test_motion_quality.py'
      - 'trance-studio/backend/client_ai_fallback.py'
      - 'trance-studio/web/studio-ai-fallback.js'
      - 'trance-studio/tests/test_narrative_plan.py'
      - 'trance-studio/tests/test_manual_share.js'
      - 'trance-studio/tests/test_simple_mobile_ui.js'
      - 'trance-studio/tests/test_auto_social_link_share.js'
      - 'trance-studio/tests/test_live_video.py'
      - '.github/workflows/kolbo-trance-android.yml'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "$ANDROID_HOME/cmdline-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up supported Python for audio/video regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg for audio and MP4 acceptance tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install and run server plus animation acceptance tests
        run: |
          python -m pip install -r trance-studio/backend/requirements.txt
          python -m unittest discover -s trance-studio/tests -v
      - name: Verify new Android user experience and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trance-studio/web/studio.html').read_text()
          assert 'id="nativeStatus"' in p and 'id="stages"' in p
          assert 'kolboImportSharedAudio' in p and 'if(!active&&files.length)setTimeout' not in p
          assert "message('התקבלו '+" in p
          assert 'id="generate" type="button" disabled' in p
          src=p.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/trance22.js').write_text(src)
          PY
          node --check /tmp/trance22.js
          node --check trance-studio/web/studio-ai-fallback.js
          node trance-studio/tests/test_manual_share.js
          node trance-studio/tests/test_native_share_resume.js
          node trance-studio/tests/test_social_link_share.js
          node trance-studio/tests/test_auto_social_link_share.js
          node trance-studio/tests/test_simple_mobile_ui.js
      - name: Build installable Android APK
        run: gradle --no-daemon --stacktrace -p trance-studio/android :app:assembleDebug
      - name: Verify APK and prepare distribution
        run: |
          set -eux
          mkdir -p dist
          cp trance-studio/android/app/build/outputs/apk/debug/app-debug.apk dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk
          test -s dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk | head -n 8
          sha256sum dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk | tee dist/SHA256SUMS.txt
      - name: Confirm independent Android package and media bridge
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk | grep -q "package: name='com.kolbomusic.trancestudio.story2462'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk | grep -q "versionCode='247' versionName='2.4.6-beta.2'"
          grep -q 'offlinePanel' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'startupPanel' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'onReceivedHttpError' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'recoverConnection' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q "document.getElementById('generate')" trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'downloadVideo' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
          grep -q 'shareVideo' trance-studio/android/app/src/main/java/com/kolbomusic/trancestudio/MainActivity.java
      - name: Verify Android installer-visible name agrees with APK version
        run: |
          set -eux
          APK="dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "application-label:'קולבו טראנס סטורי 2.4.6'"
          echo "$BADGING" | grep -Fq "package: name='com.kolbomusic.trancestudio.story2462'"
          echo "$BADGING" | grep -Fq "versionCode='247' versionName='2.4.6-beta.2'"
      - name: Archive installation APK
        uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Trance-Story-2.4.6-beta.2-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as a GitHub pre-release
        if: github.ref == 'refs/heads/kolbo-trance-studio-20261031'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="trance-story-v2.4.6-beta.2"
          APK="dist/Kolbo-Trance-Story-v2.4.6-beta.2.apk"
          # Debug signing keys are runner-specific. Never overwrite an
          # already published APK with an incompatible signing certificate.
          # Each beta receives its own Android applicationId and immutable tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; retaining the original signed APK."
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Kolbo Trance Story v2.4.6 beta 2 · Android installer name corrected" \
              --notes "Version 2.4.6: multi-file PWA WhatsApp share, native cold-start loader, preservation of in-progress WhatsApp mixes, bounded re-share, verified interactive studio UI, safe SSL handling, speech-led DJ mix. Android receives WhatsApp video up to 45 MB (60 MB total), sharing imports but never starts generation without Create. Free AI motion scenes are experimental and quota-limited. Requires internet. This beta corrects the Android installer display name to 2.4.6. New debug-signed story2462 package avoids incompatible update signatures." \
              --prerelease
          fi
