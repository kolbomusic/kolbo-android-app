name: Build Kolbo Trance Studio Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - kolbo-trance-studio-20261031
    paths:
      - 'trance-studio/android/**'
      - '.github/workflows/kolbo-trance-android.yml'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Android APK
        run: gradle --no-daemon --stacktrace -p trance-studio/android :app:assembleDebug
      - name: Verify APK and prepare distribution
        run: |
          set -eux
          mkdir -p dist
          cp trance-studio/android/app/build/outputs/apk/debug/app-debug.apk dist/Kolbo-Trance-Studio-v1.1.0-beta.apk
          test -s dist/Kolbo-Trance-Studio-v1.1.0-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Kolbo-Trance-Studio-v1.1.0-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kolbo-Trance-Studio-v1.1.0-beta.apk | head -n 8
          sha256sum dist/Kolbo-Trance-Studio-v1.1.0-beta.apk | tee dist/SHA256SUMS.txt
      - name: Archive installation APK
        uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Trance-Studio-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="trance-v1.1.0-beta.1"
          APK="dist/Kolbo-Trance-Studio-v1.1.0-beta.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Kolbo Trance Studio v1.1.0 beta · Android APK" \
              --notes "Hebrew Android studio. Installable test APK signed by GitHub Actions debug key. Supports WhatsApp audio sharing, automatic trance remix, comedy effects, and MP3 export. Android 10+; cloud connection required." \
              --prerelease
          fi
