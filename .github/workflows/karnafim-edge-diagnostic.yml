name: Karnafim Render edge path connectivity diagnostic
on:
  push:
    branches: [karnafim-safe-review-and-backup-report-20261103]
    paths:
      - '.github/workflows/karnafim-edge-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect only public HTTP status and transport errors (no member content)
        shell: bash
        run: |
          set +e
          for path in /health / /memorial /ready /login; do
            printf 'CHECK %s\n' "$path"
            curl --http1.1 --location --silent --show-error \
              --connect-timeout 10 --max-time 22 \
              --output /dev/null \
              --write-out 'HTTP=%{http_code} IP=%{remote_ip} TOTAL=%{time_total} REDIRECT=%{num_redirects}\n' \
              "https://karnafim-community-46.onrender.com$path"
            printf 'CURL_EXIT=%s\n' "$?"
          done
          for path in /moderation /members /team /inbox /memorial-sources /memorial-source-review; do
            printf 'CHECK PRIVATE %s\n' "$path"
            check="$(curl --http1.1 --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --output /dev/null \
              --write-out '%{http_code}|%{url_effective}' \
              "https://karnafim-community-46.onrender.com$path")"
            printf 'PRIVATE_STATUS=%s\n' "$check"
            if [ "$check" != "200|https://karnafim-community-46.onrender.com/login" ]; then
              echo "PRIVATE_ROUTE_NOT_VERIFIED: $path"
              exit 1
            fi
          done
          echo "PASS: private routes redirect anonymous visitors to login."
          echo "Diagnostic only. No authentication or writes were performed."
