name: Kolbo Video v416 - Public staging read-only security smoke
on:
  push:
    branches: [kolbo-video-v416-staging-android-20261011]
    paths: ['.github/workflows/kolbo-v416-public-staging-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public liveness and private bearer boundary without credentials
        run: |
          set -euo pipefail
          base='https://kolbo-video-wan416-staging.onrender.com'
          live=0
          for i in $(seq 1 9); do
            if curl --max-time 25 --fail --silent --show-error "$base/healthz" -o /tmp/live.json; then
              if python3 -c 'import json; assert json.load(open("/tmp/live.json"))["alive"] is True'; then
                live=1; break
              fi
            fi
            sleep 8
          done
          test "$live" = 1
          code=$(curl --max-time 25 -s -o /dev/null -w '%{http_code}' "$base/v1/health"); echo "No-auth health HTTP $code"; test "$code" = 401
          code=$(curl --max-time 25 -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid-token' "$base/v1/health"); echo "Wrong-auth health HTTP $code"; test "$code" = 401
          code=$(curl --max-time 25 -s -o /dev/null -w '%{http_code}' "$base/v1/jobs/00000000-0000-0000-0000-000000000000"); echo "No-auth job HTTP $code"; test "$code" = 401
          echo 'PASS live Render: public healthz available, sensitive health and video job endpoints reject unauthenticated traffic'
