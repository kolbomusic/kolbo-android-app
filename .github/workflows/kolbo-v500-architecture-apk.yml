name: Kolbo Video v5.0.0 verified native build
on:
  push:
    branches: [kolbo-video-v500-scene-verification-architecture-20261014]
    paths:
      - 'mobile-kolbo/**'
      - '.github/workflows/kolbo-v500-architecture-apk.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Offline scene-contract, language, quota and provider tests
        run: |
          mkdir -p /tmp/kolbo-v5-tests
          javac -encoding UTF-8 -d /tmp/kolbo-v5-tests \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/HebrewIntentBrain.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/V5SceneContract.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/V5RetryPolicy.java \
            mobile-kolbo/test/V5SceneContractTest.java \
            mobile-kolbo/test/HebrewIntentBrainTest.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/WanProviderCatalog.java \
            mobile-kolbo/test/WanProviderCatalogTest.java \
            mobile-kolbo/app/src/main/java/com/kolbomusic/video/ProviderErrorClassifier.java \
            mobile-kolbo/test/ProviderErrorClassifierTest.java
          java -cp /tmp/kolbo-v5-tests com.kolbomusic.video.V5SceneContractTest
          java -cp /tmp/kolbo-v5-tests com.kolbomusic.video.HebrewIntentBrainTest
          java -cp /tmp/kolbo-v5-tests com.kolbomusic.video.WanProviderCatalogTest
          java -cp /tmp/kolbo-v5-tests com.kolbomusic.video.ProviderErrorClassifierTest
      - name: V5 end-to-end wiring and no false semantic success
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-kolbo/app/src/main/java/com/kolbomusic/video')
          client=(p/'WanNativeClient.java').read_text()
          activity=(p/'MainActivity.java').read_text()
          inspector=(p/'V5OutputAudit.java').read_text()
          source=(p/'V5SourceAudit.java').read_text()
          contract=(p/'V5SceneContract.java').read_text()
          checks=[
              ('V5SceneContract.compile(scene,english,seconds)' in client,'story planning in submission'),
              ('V5SourceAudit.examine(context,image,contract.requiresNewBody)' in client,'source gate before upload'),
              (client.index('V5SourceAudit.examine(')<client.index('String path=upload(bytes)'), 'audit before transfer'),
              ('submit(path,modelInstruction,contract.negativePrompt,seconds)' in client,'negative prompt not hardcoded'),
              ('V5OutputAudit.check(result.video' in activity,'postflight checker'),
              ('audit.hasHardFailure()' in activity,'hard failure reporting'),
              ('audit.complexStory' in activity,'complex story review'),
              ('semanticVerified=false' in inspector,'no fabricated full scene compliance'),
              ('MediaMetadataRetriever.OPTION_CLOSEST' in inspector,'sample actual video frames'),
              ('FaceDetection.getClient' in source,'on-device face geometry'),
              ('ImageLabeling.getClient' in inspector,'local weak presence labels'),
              ('MUST NOT lick' in contract,'explicit known semantic error'),
              ('NO_AUTO_RETRY' not in activity,'no misleading auto retries'),
              ('WebView' not in activity,'native UI only'),
              ('versionName \'5.0.0\'' in Path('mobile-kolbo/app/build.gradle').read_text(),'new app version')
          ]
          for good,name in checks:
              assert good,name
          print('PASS: '+str(len(checks))+' real v5 pipeline and truthfulness invariants')
          PY
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Assemble Kolbo Video v5 debug installer
        run: gradle -p mobile-kolbo :app:assembleDebug --stacktrace
      - name: Verify APK size, package and cryptographic signature
        run: |
          APK=mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Kolbo-Video-v5.0.0-Scene-QA-Android-APK
          path: mobile-kolbo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
