name: Probe Video Studio 1.2.1 providers
on:
  push:
    branches: [video-studio-121-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate real LTX 2.5 video with audio
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/gradio-app/gradio/main/test/test_files/bus.png -o input.png
          python3 - <<'PY'
          import json,urllib.request,uuid,re
          base='https://chopperblu-ltx-2-5-demo.hf.space';ua='Kolbo-Video-Studio/1.2.1'
          b='Kolbo'+uuid.uuid4().hex;raw=open('input.png','rb').read()
          body=(('--'+b+'\r\nContent-Disposition: form-data; name="files"; filename="input.png"\r\nContent-Type: image/png\r\n\r\n').encode()+raw+('\r\n--'+b+'--\r\n').encode())
          req=urllib.request.Request(base+'/gradio_api/upload',data=body,method='POST',headers={'Content-Type':'multipart/form-data; boundary='+b,'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=30) as r:path=json.loads(r.read().decode())[0]
          image={'path':path,'orig_name':'input.png','mime_type':'image/png','meta':{'_type':'gradio.FileData'}}
          prompt='The same bus drives clearly forward into an indoor garage and stops in the service bay. Natural tire rolling, engine hum and indoor garage ambience, no speech, no music.'
          data=[prompt,image,512,512,2.0,False,42,False,'conv']
          req=urllib.request.Request(base+'/gradio_api/call/generate_video',data=json.dumps({'data':data}).encode(),method='POST',headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':ua})
          with urllib.request.urlopen(req,timeout=30) as r:raw=r.read().decode()
          print('SUBMIT',raw);event=json.loads(raw)['event_id'];assert re.fullmatch(r'[A-Za-z0-9_-]{1,120}',event)
          req=urllib.request.Request(base+'/gradio_api/call/generate_video/'+event,headers={'Accept':'text/event-stream','User-Agent':ua})
          with urllib.request.urlopen(req,timeout=600) as r:s=r.read().decode('utf-8','replace')
          print('SSE',s[:40000])
          ev='';parts=[];complete=None
          for line in s.splitlines()+['']:
              if not line:
                  if ev=='complete':complete='\n'.join(parts)
                  if ev=='error':raise RuntimeError('provider error '+ '\n'.join(parts))
                  ev='';parts=[];continue
              if line.startswith('event:'):ev=line[6:].strip()
              elif line.startswith('data:'):parts.append(line[5:].strip())
          assert complete
          obj=json.loads(complete)
          def find(o):
              if isinstance(o,dict):
                  u=o.get('url')
                  if isinstance(u,str) and u.startswith(base+'/'):return u
                  for v in o.values():
                      z=find(v)
                      if z:return z
              if isinstance(o,list):
                  for v in o:
                      z=find(v)
                      if z:return z
          url=find(obj);print('URL',url);assert url
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=90) as r:data=r.read(25*1024*1024)
          print('BYTES',len(data),data[:16]);assert len(data)>1000 and data[4:8]==b'ftyp'
          assert b'soun' in data, 'audio handler missing'
          print('LTX25_NATIVE_AUDIO_PASS=YES')
          PY
