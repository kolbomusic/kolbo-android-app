name: Karnafim security and route regression
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
# Old commit-specific live checks become irrelevant when a newer commit lands.
# Cancel them so one workflow tests the current branch head against Render.
concurrency:
  group: karnafim-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python compilation and static audit
        run: |
          python -m compileall -q karnafim-site
          python karnafim-site/security_regression.py
      - name: Live check after deploy
        shell: bash
        run: |
          for attempt in {1..32}; do
            echo "Checking deployment attempt $attempt"
            if python karnafim-site/security_regression.py --live --expect-revision "$GITHUB_SHA"; then
              echo "Public routes, security headers, and sensitive-route lockdown verified."
              exit 0
            fi
            sleep 6
          done
          echo '::error::Karnafim live site is failing safety checks or Render deploy is behind the tested Git SHA.'
          exit 1
