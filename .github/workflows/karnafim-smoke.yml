name: Karnafim read-only security check
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Python modules
        run: python -m compileall -q karnafim-site
      - name: Verify site is public read-only, login stays disabled
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..25}; do
            home=$(curl -L -s -o /tmp/karnafim-home -w '%{http_code}' --max-time 20 https://karnafim-community-46.onrender.com/ || true)
            login=$(curl -L -s -o /tmp/karnafim-login -w '%{http_code}' --max-time 20 https://karnafim-community-46.onrender.com/login || true)
            echo "Attempt $attempt: home=$home login=$login"
            if [ "$home" = "200" ] && [ "$login" = "503" ] && grep -q 'האתר' /tmp/karnafim-home; then
              ok=1
              for part in archive memorials find status source/1 source/4 source/5 source/14 memorial/yehonatan-sharabi memorial/benaya-rein memorial/uri-grossman memorial/adam-goren memorial/alexander-bunimovich; do
                code=$(curl -L -s -o /tmp/karnafim-"$part" -w '%{http_code}' --max-time 20 "https://karnafim-community-46.onrender.com/$part" || true)
                echo "$part HTTP $code"
                if [ "$code" != "200" ]; then ok=0; fi
                if grep -Eiq '<form|<input|type="password"' /tmp/karnafim-"$part"; then ok=0; fi
              done
              if grep -Eiq '<form|<input|type="password"' /tmp/karnafim-home; then ok=0; fi
              if [ "$ok" = "1" ]; then echo "Safe public routes OK; login disabled"; exit 0; fi
            fi
            sleep 5
          done
          echo "Unable to validate live public read-only mode"
          exit 1
