name: Karnafim rebuilt security and RTL quality
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * *'
permissions:
  contents: read
jobs:
  safe-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rebuilt application dependencies
        run: python -m pip install -r karnafim-site/requirements.txt
      - name: Python syntax check
        run: python -m compileall -q karnafim-site
      - name: Verify RTL pages, links, accessibility, privacy and closed authentication
        run: python karnafim-site/tests/test_rebuilt_design.py
