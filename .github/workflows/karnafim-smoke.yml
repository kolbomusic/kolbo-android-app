name: Karnafim links and routes audit
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile every site module
        run: python -m compileall -q karnafim-site
      - name: Wait for latest public website deployment
        shell: bash
        run: |
          for n in {1..25}; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 10 https://karnafim-community-46.onrender.com/favicon.svg || true)"
            if [ "$status" = "200" ]; then echo "Site reachable with updated favicon"; exit 0; fi
            echo "Waiting for new deployment (favicon HTTP $status)"
            sleep 5
          done
          echo "Timed out waiting for deployment" >&2
          exit 1
      - name: Audit public pages, guarded pages, and original source links
        run: python karnafim-site/check_links.py
