name: Karnafim link and content quality audit
on:
  push:
    branches: [karnafim-veterans-portal-20261031]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-link-audit.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published source registry and internal link contracts
        run: python karnafim-site/link_audit.py
      - name: Check live source pages, memorials and site navigation
        shell: bash
        run: |
          for attempt in {1..18}; do
            echo "Verification pass $attempt"
            if python karnafim-site/link_audit.py --live; then
              echo "Public links and full-source routes passed."
              exit 0
            fi
            sleep 10
          done
          echo "Public links/content audit failed; see logged failing URLs."
          exit 1

      - name: Verify original publishers actually serve topic-relevant pages
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          KARNAFIM_LINK_REPORT=external_link_report.json python karnafim-site/verify_external_sources.py
      - name: Save independent source verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karnafim-source-verification
          path: external_link_report.json
          if-no-files-found: warn
          retention-days: 14
