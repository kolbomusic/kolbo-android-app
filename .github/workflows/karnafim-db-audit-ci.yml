name: Karnafim safe database endpoint audit
on:
  push:
    branches: [karnafim-db-readiness-audit-20261103]
    paths:
      - 'karnafim-site/**'
      - '.github/workflows/karnafim-db-audit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BARKAN_PUBLIC_AUTH: '0'
      BARKAN_SAFETY_RELEASE_APPROVED: '0'
      BARKAN_ALLOW_SIGNUP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: python -m pip install -r karnafim-site/requirements.txt
      - name: Verify source compilation
        run: python -m compileall -q karnafim-site
      - name: Verify non-secret Neon endpoint tag
        run: python karnafim-site/tests/test_db_endpoint_audit.py
      - name: Verify public privacy, permissions and RTL
        run: python karnafim-site/tests/test_rebuilt_design.py
