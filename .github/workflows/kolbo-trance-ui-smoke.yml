name: Kolbo Trance Android visible launch acceptance
on:
  push:
    branches:
      - kolbo-trance-share-no-reload-244-20261102
      - kolbo-trance-studio-20261031
      - kolbo-trance-visual-acceptance-kvm-20261102
    paths:
      - 'trance-studio/android/**'
      - '.github/workflows/kolbo-trance-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-visible-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build the actual production Android UI source
        run: gradle --no-daemon -p trance-studio/android :app:assembleDebug
      - name: Install screenshot inspector
        run: python -m pip install --disable-pip-version-check pillow
      - name: Enable GitHub hosted runner hardware virtualization
        run: |
          set -eu
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "::error::GitHub runner lacks /dev/kvm; real Android visual validation is unavailable"
            exit 1
          fi
      - name: Boot Android and assert non-black, visible native startup UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 360
          disable-linux-hw-accel: false
          script: |
            set -e
            adb install -r trance-studio/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.kolbomusic.trancestudio.story244/com.kolbomusic.trancestudio.MainActivity
            sleep 6
            adb exec-out screencap -p > /tmp/kolbo-trance-launch.png
            python trance-studio/tests/inspect_android_launch.py /tmp/kolbo-trance-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolbo-android-launch-evidence
          path: /tmp/kolbo-trance-launch.png
          if-no-files-found: ignore
          retention-days: 7
