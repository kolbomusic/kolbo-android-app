name: Kolbo Trance live original-source ASR fallback
on:
  push:
    branches: [kolbo-trance-studio-20261031]
    paths:
      - 'trance-studio/tests/trigger-asr-smoke.txt'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deployed Render accepts video request without browser transcript
        run: python trance-studio/tests/live_asr_fallback_smoke.py
