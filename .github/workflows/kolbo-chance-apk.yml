name: Kolbo Chance Android APK
on:
  push:
    branches:
      - feature/kolbo-chance-apk-20261025
    paths:
      - 'chance-android/**'
      - '.github/workflows/kolbo-chance-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile signed debug APK
        working-directory: chance-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare signed development APK
        run: |
          mkdir -p out
          cp chance-android/app/build/outputs/apk/debug/app-debug.apk out/Kolbo-Chance-AI-dev-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kolbo-chance-signed-development-apk
          path: out/*
          retention-days: 2
