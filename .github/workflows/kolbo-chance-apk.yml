name: Kolbo Chance Android APK
on:
  push:
    branches:
      - feature/kolbo-chance-apk-20261025
    paths:
      - 'chance-android/**'
      - '.github/workflows/kolbo-chance-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile release APK (unsigned)
        working-directory: chance-android
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Prepare APK and signing utilities
        run: |
          mkdir -p out
          cp chance-android/app/build/outputs/apk/release/app-release-unsigned.apk out/Kolbo-Chance-AI-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: kolbo-chance-unsigned-and-tools
          path: out/*
          retention-days: 2
