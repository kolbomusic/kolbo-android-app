name: Kolbo Chance Android APK
on:
  push:
    branches:
      - feature/kolbo-chance-apk-20261025
    paths:
      - 'chance-android/**'
      - '.github/workflows/kolbo-chance-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify CSV source and auto-refresh parser
        run: python3 chance-android/sync/refresh_chance_csv.py
      - name: Validate product JS
        run: node --check chance-android/app/src/main/assets/upgrade.js
      - name: Verify Owner JavaScript syntax
        run: |
          node -e "const fs=require('fs');const content=fs.readFileSync('chance-android/owner/src/main/assets/index.html','utf8');const block=content.match(/<script>([\s\S]*?)<\/script>/);if(!block)process.exit(1);fs.writeFileSync('/tmp/chance-owner.js',block[1]);"
          node --check /tmp/chance-owner.js
      - name: Validate owner-only presentation JS
        run: node --check chance-android/owner/src/main/assets/owner-ui.js
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile signed debug APK
        working-directory: chance-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare signed development APK
        run: |
          mkdir -p out
          cp chance-android/app/build/outputs/apk/debug/app-debug.apk out/Kolbo-Chance-AI-dev-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kolbo-chance-signed-development-apk
          path: out/*
          retention-days: 2
      - name: Compile unsigned production release for local private signing
        working-directory: chance-android
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Compile isolated owner app (unsigned)
        working-directory: chance-android
        run: gradle --no-daemon :owner:assembleRelease
      - name: Package unsigned release and signing utilities
        run: |
          mkdir -p unsigned
          cp chance-android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned/Kolbo-Chance-AI-release-unsigned.apk
          cp chance-android/owner/build/outputs/apk/release/owner-release-unsigned.apk unsigned/Kolbo-Chance-Owner-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" unsigned/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: kolbo-chance-production-unsigned-tools
          path: unsigned/*
          retention-days: 2
      - name: Verify signed debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/Kolbo-Chance-AI-dev-signed.apk
